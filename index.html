/* ---------- 키 없이도 보이는 코스 지도 (SVG) ---------- */
function routeSvg(pts, opts){
  opts = opts || {};
  var W = 360, H = 220, PAD = 24;
  var list = (pts || []).filter(function(p){ return p && isFinite(p.lat) && isFinite(p.lng); });
  if(!list.length) return '';
  list = sampleEvenly(list, 900);
  var minLat = 90, maxLat = -90, minLng = 180, maxLng = -180, i, p;
  for(i=0;i<list.length;i++){
    p = list[i];
    if(p.lat < minLat) minLat = p.lat;
    if(p.lat > maxLat) maxLat = p.lat;
    if(p.lng < minLng) minLng = p.lng;
    if(p.lng > maxLng) maxLng = p.lng;
  }
  var midLat = (minLat + maxLat) / 2, kx = Math.cos(midLat * Math.PI / 180);
  if(!(kx > 0.2)) kx = 0.2;
  var spanX = Math.max((maxLng - minLng) * kx, 1e-9), spanY = Math.max(maxLat - minLat, 1e-9);
  var s = Math.min((W - PAD*2) / spanX, (H - PAD*2) / spanY);
  if(!isFinite(s) || s <= 0) s = 1;
  var cx = (minLng + maxLng) / 2, cy = (minLat + maxLat) / 2;
  function xy(q){ return [W/2 + (q.lng - cx) * kx * s, H/2 - (q.lat - cy) * s]; }
  var step = Math.max(1, Math.round(list.length / 260)), d = '';
  for(i=0;i<list.length;i+=step){
    var q = xy(list[i]);
    d += (d ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1);
  }
  var lastQ = xy(list[list.length - 1]);
  d += 'L' + lastQ[0].toFixed(1) + ' ' + lastQ[1].toFixed(1);
  var a = xy(list[0]);
  var lx = Math.min(W - 44, a[0] + 12), ly = Math.max(16, a[1] - 9);
  var uid = String(opts.uid || 'm').replace(/[^A-Za-z0-9_]/g, '');
  return '<svg class="route-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="운행 경로">'
    + '<path d="' + d + '" fill="none" stroke="#0B1120" stroke-opacity="0.65" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<path d="' + d + '" fill="none" stroke="#DC2626" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>'
    + (list.length > 1 ? '<circle cx="' + lastQ[0].toFixed(1) + '" cy="' + lastQ[1].toFixed(1) + '" r="4.4" fill="#0B1120" stroke="#60A5FA" stroke-width="2.6"/>' : '')
    + '<circle cx="' + a[0].toFixed(1) + '" cy="' + a[1].toFixed(1) + '" r="7.4" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.4"/>'
    + '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" font-size="11.5" font-weight="800" fill="#E8EDF5" stroke="#0B1120" stroke-width="3" paint-order="stroke">출발</text>'
    + '</svg>';
}

/* ---------- 좌표 → 동네 이름 (역지오코딩 · 결과는 이 기기에 캐시) ---------- */
var GEO_CACHE_KEY = 'taxi.geo.v1';
var geoNameCache = null;
function geoCache(){
  if(geoNameCache) return geoNameCache;
  geoNameCache = {};
  try{
    var raw = localStorage.getItem(GEO_CACHE_KEY);
    if(raw){ var v = JSON.parse(raw); if(v && typeof v === 'object') geoNameCache = v; }
  }catch(e){}
  return geoNameCache;
}
function geoSaveCache(){
  try{
    var keys = Object.keys(geoNameCache || {});
    if(keys.length > 300){
      var keep = {};
      keys.slice(keys.length - 200).forEach(function(k){ keep[k] = geoNameCache[k]; });
      geoNameCache = keep;
    }
    localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(geoNameCache));
  }catch(e){}
}
function geoKeyOf(p){ return Number(p.lat).toFixed(3) + ',' + Number(p.lng).toFixed(3); }
function coordText(p){ return Number(p.lat).toFixed(4) + ', ' + Number(p.lng).toFixed(4); }
/* 구글 지오코더 결과 → "구로구 개봉동"(출발) / "구로구 경인로8길"(도착) */
function placeFromGoogle(res, mode){
  var comps = (res && res.address_components) || [];
  function pick(type){
    for(var i=0;i<comps.length;i++){ if(comps[i] && comps[i].types && comps[i].types.indexOf(type) !== -1) return comps[i].long_name || ''; }
    return '';
  }
  var gu = pick('sublocality_level_1') || pick('administrative_area_level_2') || pick('locality') || '';
  var dong = pick('sublocality_level_2') || pick('sublocality_level_3') || pick('neighborhood') || '';
  var road = pick('route') || '';
  var num = pick('street_number') || '';
  var roadFull = road ? (road + (num ? ' ' + num : '')) : '';
  var main = (mode === 'end') ? (roadFull || dong) : (dong || roadFull);
  var out = [gu, main].filter(Boolean).join(' ');
  if(!out && res && res.formatted_address) out = String(res.formatted_address).split(',').slice(0,2).join(' ').trim();
  return out;
}
/* Nominatim(무료) 결과 → 같은 형식 */
function placeFromNominatim(j, mode){
  var a = j && j.address;
  if(!a){
    if(j && j.display_name) return String(j.display_name).split(',').slice(0,2).join(' ').trim();
    return '';
  }
  var gu = a.city_district || a.borough || a.county || a.city || a.town || a.province || '';
  var dong = a.quarter || a.neighbourhood || a.suburb || a.village || a.hamlet || a.city_district || '';
  var road = a.road || a.pedestrian || a.footway || '';
  var num = a.house_number || '';
  var roadFull = road ? (road + (num ? ' ' + num : '')) : '';
  var main = (mode === 'end') ? (roadFull || dong) : (dong || roadFull);
  var out = main ? ((gu && main !== gu) ? (gu + ' ' + main) : main) : gu;
  if(!out && j.display_name) out = String(j.display_name).split(',').slice(0,2).join(' ').trim();
  return out;
}
function reverseGeocode(p, mode){
  mode = mode || 'start';
  return new Promise(function(resolve){
    if(!p || !isFinite(p.lat) || !isFinite(p.lng)){ resolve(''); return; }
    var tag = geoKeyOf(p) + '|' + mode;
    var c = geoCache();
    if(c[tag]){ resolve(c[tag]); return; }
    function done(name){
      if(name){ c[tag] = name; geoSaveCache(); }
      resolve(name || '');
    }
    function nominatim(){
      if(typeof fetch !== 'function'){ done(''); return; }
      var url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=ko&lat=' + Number(p.lat).toFixed(5) + '&lon=' + Number(p.lng).toFixed(5);
      fetch(url, {headers:{'Accept':'application/json'}}).then(function(r){ return r.json(); })
        .then(function(j){ done(placeFromNominatim(j, mode)); })
        .catch(function(){ done(''); });
    }
    var gkey = String((state.settings && state.settings.gmapsKey) || '').trim();
    if(gkey && typeof window !== 'undefined' && window.google && window.google.maps && window.google.maps.Geocoder){
      try{
        new google.maps.Geocoder().geocode({location:{lat:Number(p.lat), lng:Number(p.lng)}, language:'ko'}, function(res, status){
          if(status === 'OK' && res && res[0]) done(placeFromGoogle(res[0], mode));
          else nominatim();
        });
        return;
      }catch(e){}
    }
    nominatim();
  });
}
function placeText(p, mode){
  if(!p) return '위치 기록 없음';
  return geoCache()[geoKeyOf(p) + '|' + (mode || 'start')] || '위치 확인 중…';
}
function fillPlace(id, p, mode){
  var el = document.getElementById(id);
  if(!el || !p) return;
  var tag = geoKeyOf(p) + '|' + mode;
  if(el.getAttribute('data-pt') !== tag) el.setAttribute('data-pt', tag);
  var cached = geoCache()[tag];
  if(cached){ el.textContent = cached; return; }
  if(typeof navigator !== 'undefined' && navigator && navigator.onLine === false){ el.textContent = coordText(p); return; }
  el.textContent = '위치 확인 중…';
  reverseGeocode(p, mode).then(function(name){
    var cur = document.getElementById(id);
    if(!cur || cur.getAttribute('data-pt') !== tag) return;
    cur.textContent = name || coordText(p);
  });
}
function fillCoursePlaces(pts){
  var list = (pts || []).filter(function(p){ return p && isFinite(p.lat) && isFinite(p.lng); });
  if(!list.length) return;
  fillPlace('courseLocStart', list[0], 'start');
  fillPlace('courseLocEnd', list[list.length - 1], 'end');
}

/* ---------- 사진 ---------- */
function resizeImage(file, maxSide, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('image')); };
      img.onload = function(){
        try{
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function handlePhotoFiles(input){
  var files = Array.prototype.slice.call(input.files || []);
  if(!files.length) return;
  var key = ui.date;
  var day = touchDay(key);
  var pending = files.length, failed = 0;
  files.forEach(function(file){
    resizeImage(file, 1100, 0.68).then(function(dataUrl){
      day.photos.push({id: 'p' + Date.now() + Math.random().toString(36).slice(2,6), name: file.name || '', data: dataUrl});
      day.u = Date.now();
    }).catch(function(){ failed++; }).then(function(){
      pending--;
      if(pending === 0){
        saveNow(); render();
        toast(failed ? ('사진 ' + failed + '장은 넣지 못했습니다') : '사진을 추가했습니다');
      }
    });
  });
  input.value = '';
}

  box.innerHTML = hits.slice(0, 40).map(function(h){

/* ---------- 백업 · 초기화 ---------- */
function downloadText(name, text, mime){
  try{
    var blob = new Blob([text], {type: mime || 'application/json;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 2000);
  }catch(e){ toast('파일을 만들지 못했습니다.'); }
}
function backupNow(){
  var copy = {app:'개인택시 운행관리', version:1, exportedAt:new Date().toISOString(), settings:state.settings, settingsUpdated:state.settingsUpdated, days:state.days, deleted:state.deleted, meta:state.meta};
  downloadText('개인택시-운행관리-백업-' + todayKey() + '.json', JSON.stringify(copy, null, 1));
  toast('백업 파일을 내려받았습니다');
}
function handleRestore(input){
  var f = input.files && input.files[0];
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var raw = JSON.parse(String(reader.result));
      if(!raw || typeof raw !== 'object' || !raw.days || typeof raw.days !== 'object') throw new Error('bad format');
      var n = Object.keys(raw.days).length;
      if(!confirm('백업 파일에 ' + n + '일치 기록이 있습니다.\n이 기기의 기록을 백업 파일 내용으로 바꿉니다. (지금 기록은 먼저 파일로 내려받습니다)')){ input.value = ''; return; }
      backupNow();
      var session = state.session;
      var next = normalizeState(raw);
      next.session = session;
      state = next;
      try{ recoverSession(); }catch(e){}
      saveNow(); render();
      toast('복원 완료 · ' + n + '일치');
    }catch(e){
      alert('백업 파일을 읽지 못했습니다. 이 앱에서 내려받은 JSON 파일인지 확인해 주세요.');
    }
    input.value = '';
  };
  reader.readAsText(f);
}
function addSampleData(){
  var now = new Date();
  var y = now.getFullYear(), mo = now.getMonth()+1;
  var last = now.getDate();
  var seed = 20261117;
  function rnd(){ seed = (seed*1103515245 + 12345) % 2147483648; return seed/2147483648; }
  var added = 0;
  for(var dd=1; dd<=last; dd++){
    var key = y + '-' + pad2(mo) + '-' + pad2(dd);
    var existing = state.days[key];
    if(existing && dayHasData(existing)) continue;
    var dow = new Date(y, mo-1, dd).getDay();
    var d = ensureDay(key);
    d.off = false;
    d.u = Date.now();
    if(dow === 0 || isPatternOff(key, state.settings.offWeekdays)){ d.off = true; d.runs = []; added++; continue; }
    var startH = 7 + Math.floor(rnd()*3), startM = Math.floor(rnd()*4)*15;
    var workH = 8 + Math.floor(rnd()*4), workM = Math.floor(rnd()*4)*15;
    var st = new Date(y, mo-1, dd, startH, startM, 0);
    var en = new Date(st.getTime() + (workH*60 + workM)*60000);
    d.runs = [{s: dtInput(st), e: dtInput(en)}];
    var card = 120000 + Math.floor(rnd()*26)*10000;
    var cash = 20000 + Math.floor(rnd()*8)*5000;
    d.income = {card: card, cash: cash, toll: Math.floor(rnd()*3)*1000, direct:'', mode:'auto'};
    var total = 160 + Math.floor(rnd()*140);
    d.distance = {total: total, business: Math.round(total*(0.55 + rnd()*0.15))};
    var L = Math.round((28 + rnd()*18)*10)/10;
    var unit = 1050 + Math.floor(rnd()*80);
    d.charges = [{id:'c'+dd, station:'SK가스', fuel:'LPG', liters:L, unit:unit, amount: Math.round(L*unit)}];
    d.expenses = [{id:'e'+dd, cat:'식비', pay:'현금', amount: 6000 + Math.floor(rnd()*5)*1000, memo:'점심'}];
    if(rnd() < 0.3) d.expenses.push({id:'e'+dd+'b', cat:'세차', pay:'카드', amount: 15000, memo:'자가세차'});
    d.memo = rnd() < 0.35 ? '샘플 기록' : '';
    added++;
  }
  saveNow(); render();
  toast('샘플 ' + added + '일치를 넣었습니다 · 설정에서 초기화할 수 있어요');
}
function resetAll(){
  var n = Object.keys(state.days).length;
  if(!confirm('운행 기록 ' + n + '일치를 모두 지웁니다.\n차량 정보·API 키·구글 로그인 설정은 그대로 둡니다.\n\n지금 데이터를 먼저 백업 파일로 내려받습니다. 계속할까요?')) return;
  backupNow();
  var ts = Date.now();
  Object.keys(state.days).forEach(function(k){ state.deleted[k] = ts; });
  state.days = {};
  state.settings.offWeekdays = [];
  state.settings.offMemo = '';
  /* 충전소 목록은 그대로 둔다(사용자가 지운 충전소는 지운 채로). 목록이 아예 없을 때만 기본 충전소를 되살린다. */
  if(!Array.isArray(state.settings.stations)) state.settings.stations = defaultStations();
  state.settingsUpdated = ts;
  saveNow(); render();
  toast('운행 기록을 모두 지웠습니다');
}

var GIS_SRC = 'https://accounts.google.com/gsi/client';
var DRIVE_SCOPE = 'openid email https://www.googleapis.com/auth/drive.appdata';
var SYNC_FILE = 'tapp_personal_taxi_sync.json';
var gisPromise = null, tokenClient = null, accessToken = null, tokenExp = 0;
var syncing = false, autoSyncTimer = null, lastSyncMsg = '';

function errText(err){
  var m = String(err && err.message ? err.message : err);
  if(m === 'no_client') return 'OAuth 클라이언트 ID를 먼저 입력해 주세요';
  if(m === 'gis' || m === 'gis_load' || m === 'gis_timeout') return '구글 로그인 스크립트를 불러오지 못했습니다 (네트워크 확인)';
  if(m === 'popup_closed' || m === 'access_denied' || m === 'user_cancel') return '로그인 창을 닫았습니다';
  if(m === 'interaction_required' || m === 'login_required') return '다시 로그인해 주세요';
  if(m === 'auth') return '구글 인증에 실패했습니다';
  if(/^HTTP 401/.test(m)) return '로그인이 만료되었습니다. 다시 로그인해 주세요';
  if(/^HTTP 403/.test(m)) return '드라이브 접근이 거부되었습니다 (' + (m.slice(9, 100) || 'Drive API/권한 확인') + ')';
  if(/^HTTP 404/.test(m)) return '동기화 파일을 찾지 못했습니다';
  if(/^HTTP /.test(m)) return '구글 서버 오류 (' + m.slice(0, 60) + ')';
  if(/Failed to fetch|NetworkError|network/i.test(m)) return '네트워크에 연결하지 못했습니다';
  return m;
}
function setSyncMsg(msg){
  lastSyncMsg = msg || '';
  var el = document.getElementById('syncStatus');
  if(el){
    if(msg){ el.textContent = msg; el.className = 'warn-box'; }
    else { el.textContent = syncStatusText(); el.className = 'hint-box'; }
  }
}
function syncStatusText(){
  if(!syncMeta.email) return '로그인 전 · 모든 기록은 이 기기에만 저장됩니다.';
  var base = syncMeta.email + ' · 마지막 동기화 ' + (syncMeta.lastSyncAt ? fmtShortTime(syncMeta.lastSyncAt) : '아직');
  if(!accessToken || Date.now() > tokenExp) base += ' · 앱을 새로 열었으면 [지금 동기화]를 한 번 눌러 주세요';
  return base;
}
function loadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(gisPromise) return gisPromise;
  gisPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = GIS_SRC; s.async = true; s.defer = true;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ gisPromise = null; reject(new Error('gis_load')); };
    document.head.appendChild(s);
    setTimeout(function(){
      if(!(window.google && google.accounts && google.accounts.oauth2)){ gisPromise = null; reject(new Error('gis_timeout')); }
    }, 12000);
  });
  return gisPromise;
}
function requestToken(interactive){
  return new Promise(function(resolve, reject){
    var cid = (state.settings.oauthClientId || '').trim();
    if(!cid) return reject(new Error('no_client'));
    if(!window.google || !google.accounts || !google.accounts.oauth2) return reject(new Error('gis'));
    try{
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: DRIVE_SCOPE,
        callback: function(resp){
          if(!resp || resp.error){ reject(new Error(resp && resp.error ? resp.error : 'auth')); return; }
          accessToken = resp.access_token;
          tokenExp = Date.now() + (Number(resp.expires_in) || 3600)*1000 - 60000;
          resolve(resp);
        }
      });
      tokenClient.requestAccessToken(interactive ? {prompt:'select_account'} : {});
    }catch(e){ reject(e); }
  });
}
async function ensureToken(interactive){
  if(accessToken && Date.now() < tokenExp) return accessToken;
  await loadGis();
  await requestToken(!!interactive);
  return accessToken;
}
async function authFetch(url, opts){
  var tok = await ensureToken(false);
  var o = opts || {};
  o.headers = Object.assign({}, o.headers || {}, {Authorization: 'Bearer ' + tok});
  var res = await fetch(url, o);
  if(res.status === 401){
    accessToken = null;
    tok = await ensureToken(false);
    o.headers.Authorization = 'Bearer ' + tok;
    res = await fetch(url, o);
  }
  if(!res.ok){
    var txt = '';
    try{ txt = await res.text(); }catch(e){}
    throw new Error('HTTP ' + res.status + ' ' + txt.slice(0, 160));
  }
  return res;
}
async function findSyncFile(){
  var q = encodeURIComponent("name = '" + SYNC_FILE + "' and trashed = false");
  var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime,size)&q=' + q;
  var res = await authFetch(url);
  var data = await res.json();
  var files = (data && data.files) || [];
  return files.length ? files[0] : null;
}
async function downloadSyncFile(id){
  var res = await authFetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?alt=media');
  return await res.json();
}
async function uploadSync(payload, fileId){
  var boundary = '----thtaxi' + Date.now();
  var metaObj = fileId ? {name: SYNC_FILE, mimeType: 'application/json'} : {name: SYNC_FILE, mimeType: 'application/json', parents: ['appDataFolder']};
  var meta = JSON.stringify(metaObj);
  var body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta
    + '\r\n--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(payload)
    + '\r\n--' + boundary + '--';
  var url = 'https://www.googleapis.com/upload/drive/v3/files' + (fileId ? ('/' + encodeURIComponent(fileId)) : '') + '?uploadType=multipart&fields=id,modifiedTime';
  var res = await authFetch(url, {method: fileId ? 'PATCH' : 'POST', headers: {'Content-Type': 'multipart/related; boundary=' + boundary}, body: body});
  return await res.json();
}
function syncPayload(st){
  var settings = {};
  Object.keys(st.settings || {}).forEach(function(k){
    if(k !== 'gmapsKey' && k !== 'oauthClientId' && k !== 'opinetKey') settings[k] = st.settings[k];
  });
  return {version:1, appVersion:'1.0', settings:settings, settingsUpdated: st.settingsUpdated, days: st.days, deleted: st.deleted, meta: st.meta};
}
async function syncNow(opts){
  opts = opts || {};
  if(!isHttpsOrigin(location.protocol, location.hostname)){
    if(!opts.silent) toast('구글 동기화는 https:// 주소에서 동작합니다');
    return;
  }
  if(!syncMeta.email && !opts.interactive) return;
  if(!navigator.onLine){ setSyncMsg('오프라인 · 연결되면 다시 맞춰집니다'); return; }
  if(syncing) return;
  syncing = true;
  var msgBefore = lastSyncMsg;
  setSyncMsg('구글 드라이브와 동기화 중…');
  try{
    await ensureToken(!!opts.interactive);
    var file = await findSyncFile();
    var remote = null;
    if(file && file.id){
      try{ remote = await downloadSyncFile(file.id); }catch(e){ remote = null; }
    }
    var base = remote ? mergeStates(state, remote) : normalizeState(state);
    var payload = syncPayload(base);
    var saved = await uploadSync(payload, file && file.id);
    var session = state.session;
    var localKey = state.settings.gmapsKey, localCid = state.settings.oauthClientId, localOpinet = state.settings.opinetKey, localGemini = state.settings.geminiKey;
    var next = normalizeState(payload);
    next.session = session;
    next.settings.gmapsKey = localKey;
    next.settings.oauthClientId = localCid;
    next.settings.opinetKey = localOpinet;
    if(!next.settings.geminiKey && localGemini) next.settings.geminiKey = localGemini;
    state = next;
    /* 병합 결과에 세션 표시가 없어도 미종료 운행이 있으면 운행 중으로 되살린다. */
    try{ recoverSession(); }catch(e){}
    syncMeta.fileId = (saved && saved.id) || (file && file.id) || '';
    syncMeta.lastSyncAt = Date.now();
    saveSyncMeta();
    saveLocal();
    if(opts.render !== false) render();
    else {
      var ae = document.activeElement;
      var typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
      if(!typing) render();
    }
    setSyncMsg('');
    if(!opts.silent) toast('구글 드라이브와 동기화했습니다');
  }catch(err){
    setSyncMsg('동기화하지 못했습니다 · ' + errText(err));
    if(!opts.silent) toast('동기화하지 못했습니다 · ' + errText(err));
    else lastSyncMsg = msgBefore;
  }finally{
    syncing = false;
  }
}
function scheduleAutoSync(delay){
  if(!syncMeta.email) return;
  if(!isHttpsOrigin(location.protocol, location.hostname)) return;
  if(!accessToken || Date.now() > tokenExp) return;
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(function(){ syncNow({silent:true, render:false}); }, delay || 4000);
}
function autoReconnect(){
  if(!syncMeta.email) return;
  if(!isHttpsOrigin(location.protocol, location.hostname)) return;
  if(!navigator.onLine) return;
  if(accessToken && Date.now() < tokenExp) return;
  ensureToken(false).then(function(){
    scheduleAutoSync(1200);
  }).catch(function(){});
}
async function signIn(){
  if(!isHttpsOrigin(location.protocol, location.hostname)){ toast('구글 로그인은 https:// 웹 주소에서만 됩니다'); return; }
  var cid = (state.settings.oauthClientId || '').trim();
  if(!cid){
    toast('Google OAuth 클라이언트 ID를 먼저 입력해 주세요');
    var el = document.querySelector('[data-field="settings.oauthClientId"]');
    if(el) el.focus();
    return;
  }
  try{
    setSyncMsg('구글 로그인 창을 여는 중…');
    await loadGis();
    await ensureToken(true);
    var email = '';
    try{
      var res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers: {Authorization: 'Bearer ' + accessToken}});
      if(res.ok){ var info = await res.json(); email = info.email || ''; }
    }catch(e){}
    syncMeta.email = email || 'Google 계정';
    saveSyncMeta();
    render();
    await syncNow({interactive:true});
  }catch(err){
    setSyncMsg('로그인하지 못했습니다 · ' + errText(err));
    toast('로그인하지 못했습니다 · ' + errText(err));
  }
}
function signOut(){
  try{
    if(window.google && google.accounts && google.accounts.oauth2 && accessToken){
      google.accounts.oauth2.revoke(accessToken, function(){});
    }
  }catch(e){}
  accessToken = null; tokenExp = 0;
  syncMeta.email = ''; syncMeta.lastSyncAt = 0; syncMeta.fileId = '';
  saveSyncMeta();
  render();
  toast('구글 동기화에서 로그아웃했습니다. 기록은 이 기기에 그대로 있습니다.');
}

/* ---------- 오피넷 실시간 LPG 단가 불러오기 ---------- */
var opinetBusy = false;
function opinetProxyBase(){
  return String((state && state.settings && state.settings.opinetProxyUrl) || '').trim().replace(/\/+$/, '');
}
function opinetKeyValue(){
  return String((state && state.settings && state.settings.opinetKey) || '').trim();
}
function opinetConfigured(){ return !!(opinetProxyBase() && opinetKeyValue()); }
function opinetHintText(){
  if(!opinetConfigured()) return '설정 → 오피넷에서 API 키와 중계(Worker) URL을 넣으면 켜집니다';
  var at = num(state.settings.opinetAt);
  return at > 0 ? ('마지막 조회 ' + fmtShortTime(at) + ' · 단가는 오피넷 기준') : '현재 위치 반경 5km LPG 가격을 받아 옵니다';
}
function opinetErrText(err){
  var m = String(err && err.message ? err.message : err);
  if(m === 'no_proxy') return '오피넷 중계(Worker) URL이 비어 있습니다';
  if(m === 'not_ready') return '오피넷 API 키와 중계 URL을 먼저 넣어 주세요';
  if(/^HTTP 429/.test(m)) return '오피넷 호출 한도(1,500회/일)를 넘었습니다';
  if(/^HTTP 401|^HTTP 403/.test(m)) return '오피넷 인증키가 거부되었습니다 (키 확인)';
  if(/^HTTP /.test(m)) return '중계 서버 오류 (' + m.slice(0, 40) + ')';
  if(m === 'bad_json') return '중계 서버 응답을 읽지 못했습니다 (Worker 주소 확인)';
  if(/Failed to fetch|NetworkError|network/i.test(m)) return '중계 서버에 연결하지 못했습니다 (URL·인터넷 확인)';
  return m;
}
/* 현재 위치 한 번만 — 실패·시간 초과면 null(서울 전체 조회로 넘어간다). */
function currentPosition(timeoutMs){
  return new Promise(function(resolve){
    var nav = (typeof navigator !== 'undefined') ? navigator : null;
    if(!nav || !nav.geolocation || !nav.geolocation.getCurrentPosition) return resolve(null);
    var wait = num(timeoutMs) > 0 ? num(timeoutMs) : 8000;
    var done = false;
    var timer = setTimeout(function(){ if(done) return; done = true; resolve(null); }, wait + 500);
    try{
      nav.geolocation.getCurrentPosition(function(pos){
        if(done) return;
        done = true; clearTimeout(timer);
        var c = (pos && pos.coords) || {};
        var la = Number(c.latitude), lo = Number(c.longitude);
        if(!isFinite(la) || !isFinite(lo)){ resolve(null); return; }
        resolve({lat: la, lng: lo});
      }, function(){
        if(done) return;
        done = true; clearTimeout(timer); resolve(null);
      }, {enableHighAccuracy: false, timeout: wait, maximumAge: 120000});
    }catch(e){
      if(!done){ done = true; clearTimeout(timer); resolve(null); }
    }
  });
}
/* 중계(Worker) 호출 — 주소는 <proxyUrl>?ep=...&code=... 형태 */
function opinetFetch(ep, params){
  var base = opinetProxyBase(), key = opinetKeyValue();
  if(!base) return Promise.reject(new Error('no_proxy'));
  if(!key) return Promise.reject(new Error('not_ready'));
  var url = opinetUrlFor(base, key, ep, params);
  if(!url) return Promise.reject(new Error('not_ready'));
  return fetch(url, {method: 'GET'}).then(function(res){
    if(!res || !res.ok) throw new Error('HTTP ' + ((res && res.status) || 0));
    return res.text();
  }).then(function(text){
    try{ return JSON.parse(text); }catch(e){ throw new Error('bad_json'); }
  });
}
async function loadOpinetPrices(){
  if(opinetBusy) return;
  if(!opinetConfigured()){
    toast('설정에서 오피넷 API 키와 중계(Worker) URL을 먼저 넣어 주세요');
    go('settings');
    return;
  }
  opinetBusy = true;
  toast('오피넷에서 LPG 가격을 불러오는 중…');
  var scope = 'seoul';
  try{
    var pos = await currentPosition(8000);
    var data = null;
    if(pos){
      var kt = wgs84ToKatec(pos.lat, pos.lng);
      if(kt){
        try{
          data = await opinetFetch('aroundAll', {x: kt.x, y: kt.y, radius: OPINET_RADIUS_M, prodcd: OPINET_LPG, sort: 1, out: 'json'});
          scope = 'around';
        }catch(e){ data = null; }
      }
    }
    var oils = parseOpinetOils(data);
    if(!oils.length){
      scope = 'seoul';
      data = await opinetFetch('lowTop10', {area: OPINET_SEOUL_AREA, prodcd: OPINET_LPG, cnt: 20, out: 'json'});
      oils = parseOpinetOils(data);
    }
    if(!oils.length){
      toast('오피넷 응답에 LPG 가격이 없습니다 · 키와 중계 주소를 확인해 주세요');
      return;
    }
    var ts = Date.now();
    var res = mergeOpinetStations(state.settings, oils, ts, OPINET_MAX_NEW);
    state.settings.opinetAt = ts;
    var applied = applyOpinetToDay(state.days[ui.date], oils, ts);
    saveNow();
    render();
    var msg = '오피넷 LPG ' + oils.length + '곳 · ' + (scope === 'around' ? '반경 5km' : '서울 최저가');
    if(applied.length){
      msg += ' · ' + applied[0].name + ' ' + fmtNum(applied[0].price) + '원/L 적용';

function geminiCall(parts, opts){

/* 정산 화면에 적힌 날짜("11/18", "2026-11-18")를 올해 기준 YYYY-MM-DD로 바꿔 준다. */
function aiParseDate(v){
  var s = String(v || '').trim();
  if(!s) return '';
  var y, mo, d;
  var m = /^(\d{4})[-\/.년\s]+(\d{1,2})[-\/.월\s]+(\d{1,2})/.exec(s);
  if(m){ y = Number(m[1]); mo = Number(m[2]); d = Number(m[3]); }
  else {
    m = /^(\d{1,2})[-/.]\s*(\d{1,2})/.exec(s);
    if(!m) return '';
    y = new Date().getFullYear(); mo = Number(m[1]); d = Number(m[2]);
  }
  if(!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return '';
  if(y < 2000 || y > 2100) return '';
  var dt = new Date(y, mo-1, d);
  if(dt.getMonth() !== mo-1 || dt.getDate() !== d) return '';
  return dateKey(dt);
}

function applyAiToDay(day, obj){
  var applied = [];
  if(!day || !obj) return applied;
  var labels = {card:'카드수입', cash:'현금수입', kakaoCash:'카콜현금', toll:'통행요금'};
  ['card', 'cash', 'kakaoCash', 'toll'].forEach(function(k){
    var n = aiNum(obj[k]);
    if(n !== null && n >= 0){
      day.income[k] = Math.round(n);
      applied.push(labels[k]);
    }
  });
  var km = aiNum(obj.kmTotal), biz = aiNum(obj.kmBusiness);
  if(km !== null && km > 0){ day.distance.total = round1(km); applied.push('주행거리'); }
  if(biz !== null && biz > 0){ day.distance.business = round1(biz); applied.push('영업거리'); }
  var hasCharge = false;
  ['chargeAmount', 'chargeLiters', 'chargeUnit', 'station'].forEach(function(k){
    var v = obj[k];
    if(v !== null && v !== undefined && String(v).trim() !== '' && v !== 0) hasCharge = true;
  });
  if(hasCharge){
    var c = (day.charges && day.charges[0]) || null;
    if(!c){
      c = {id:'c' + Date.now(), station:'', fuel: state.settings.fuel || 'LPG', liters:'', unit:'', amount:''};
      day.charges.push(c);
    }
    if(obj.station && String(obj.station).trim()) c.station = String(obj.station).trim();
    var L = aiNum(obj.chargeLiters), U = aiNum(obj.chargeUnit), A = aiNum(obj.chargeAmount);
    if(L !== null && L > 0) c.liters = L;
    if(U !== null && U > 0) c.unit = Math.round(U);
    if(A !== null && A > 0) c.amount = Math.round(A);
    if(num(c.amount) > 0 && num(c.liters) > 0 && !(num(c.unit) > 0)){
      c.unit = Math.round(num(c.amount) / num(c.liters));
    }
    if(!(num(c.amount) > 0)) syncChargeAmounts(c, 'liters');
    if(num(c.unit) > 0 && stationKey(c.station)) rememberChargeStation(c);
    applied.push('LPG 충전');
  }
  if(obj.memo && String(obj.memo).trim() && !String(day.memo || '').trim()){
    day.memo = String(obj.memo).trim();
    applied.push('메모');
  }
  /* 카드 정산 건수는 메모에 "카드 18건"으로 이어 붙인다. */
  var cnt = aiNum(obj.cardCount);
  if(cnt !== null && cnt > 0){
    var tag = '카드 ' + Math.round(cnt) + '건';
    var memoNow = String(day.memo || '').trim();
    if(memoNow.indexOf(tag) === -1){
      day.memo = memoNow ? (memoNow + ' · ' + tag) : tag;
    }
    applied.push('카드 ' + Math.round(cnt) + '건');
  }
  return applied;
}

/* ---------- 이벤트 ---------- */
function onField(el){
  var key = el.getAttribute('data-day');
  var path = el.getAttribute('data-field');
  if(!path) return;
  var val;
  if(el.type === 'number'){
    val = (el.value === '') ? '' : Number(el.value);
    if(el.value !== '' && !isFinite(val)) val = '';
  } else {
    val = el.value;
  }
  if(!key){
    setPath(state, path, val);
    touchSettings();
    saveSoon();
    if(path === 'settings.plate'){ var p = document.getElementById('hdrPlate'); if(p) p.textContent = val; }
    if(path === 'settings.vehicle'){ var sb = document.getElementById('hdrSub'); if(sb) sb.textContent = val + ' · 광고 없음'; }
    if(path === 'settings.oauthClientId' || path === 'settings.opinetKey' || path === 'settings.opinetProxyUrl'){ /* 저장만 */ }
    if(path === 'settings.gmapsKey'){ syncHelperKeys(); }
    return;
  }
  var day = ensureDay(key);
  day.u = Date.now();
  var cm = /^charges\.(\d+)\.(liters|unit|amount|station|fuel)$/.exec(path);
  setPath(day, path, val);
  if(cm){
    var idx = Number(cm[1]);
    var c = day.charges[idx];
    if(c){
      var cf = cm[2];
      if(cf === 'liters' || cf === 'unit' || cf === 'amount'){
        syncChargeAmounts(c, cf);
        refreshCalcField(key, path, c[cf]);
        setFieldValue(idx, cf === 'amount' ? 'unit' : 'amount', c[cf === 'amount' ? 'unit' : 'amount']);
        refreshCalcField(key, 'charges.' + idx + '.' + (cf === 'amount' ? 'unit' : 'amount'), c[cf === 'amount' ? 'unit' : 'amount']);
        if(num(c.unit) > 0) rememberChargeStation(c);
      } else if(cf === 'station'){
        syncStationSelect(idx, c.station);
      }
    }
  }
  saveSoon();
  flashSaved();
  updateDayComputeds(key);
}
/* 숫자 입력칸(계산기 팝업)에 계산된 값을 되돌려 보여 준다. */
function refreshCalcField(key, path, value){
  var el = document.querySelector('input[data-calc][data-day="' + key + '"][data-field="' + path + '"]');
  if(!el) return;
  el.value = inputText(value, el.getAttribute('data-calc'));
}
function inputText(value, kind){
  if(value === '' || value === undefined || value === null) return '';
  var v = num(value);
  if(!isFinite(v)) return '';
  if(kind === 'dec') return fmtDec(v, 1);
  if(kind === 'dec2') return fmtDec(v, 2);
  return fmtNum(v);
}
/* 계산기·시계 팝업에서 확정한 값을 그 날 기록에 넣는다. */
function applyDayField(key, path, value){
  var day = ensureDay(key);
  day.u = Date.now();
  setPath(day, path, value);
  var cm = /^charges\.(\d+)\.(liters|unit|amount)$/.exec(path);
  if(cm){
    var idx = Number(cm[1]);
    var c = day.charges[idx];
    if(c && c[cm[2]] !== undefined){
      syncChargeAmounts(c, cm[2]);
      var other = (cm[2] === 'amount') ? 'unit' : 'amount';
      setFieldValue(idx, other, c[other]);
      refreshCalcField(key, 'charges.' + idx + '.' + other, c[other]);
      if(num(c.unit) > 0) rememberChargeStation(c);
    }
  }
  saveNow();
  flashSaved();
  updateDayComputeds(key);
  return day;
}
function setFieldValue(idx, field, value){
  var el = document.querySelector('input[data-field="charges.' + idx + '.' + field + '"]');
  if(el) el.value = (value === '' || value === undefined || value === null) ? '' : String(value);
}
/* 직접 친 충전소 이름에 맞춰 드롭다운 표시를 맞춘다(기억된 충전소가 아니면 선택 해제). */
function syncStationSelect(idx, name){
  var el = document.querySelector('select[data-station="' + idx + '"]');
  if(!el || !el.options) return;
  var k = stationKey(name);
  var pick = '';
  for(var i=0;i<el.options.length;i++){
    if(k && stationKey(el.options[i].value) === k){ pick = el.options[i].value; break; }
  }
  if(el.value !== pick) el.value = pick;
}
function rememberChargeStation(c){
  if(!c || !stationKey(c.station)) return;
  if(num(c.unit) <= 0) return;
  /* 충전소 단가는 settingsUpdated를 올리지 않고 충전소별 updated로만 맞춘다(다른 설정이 밀리지 않게). */
  rememberStation(state.settings, c.station, c.fuel, c.unit, Date.now());
  saveSoon();
}
/* 충전소 칸에 이름을 다 치고 나가면 기억된 단가로 채운다. */
function onStationCommit(key, idx){
  var d = state.days[key];
  if(!d || !d.charges || !d.charges[idx]) return;
  var c = d.charges[idx];
  if(!stationKey(c.station)) return;
  var mem = findStation(state.settings, c.station);
  if(mem){
    var filled = false;
    if(num(c.unit) <= 0 && num(mem.unit) > 0){ c.unit = Math.round(num(mem.unit)); filled = true; }
    if(!c.fuel && mem.fuel){ c.fuel = mem.fuel; filled = true; }
    if(filled){
      syncChargeAmounts(c, 'unit');
      setFieldValue(idx, 'unit', c.unit);
      setFieldValue(idx, 'amount', c.amount);
      updateDayComputeds(key);
      toast('기억해 둔 ' + mem.name + ' 단가 ' + fmtNum(num(mem.unit)) + '원/L를 넣었습니다');
    }
    rememberStation(state.settings, c.station, c.fuel, c.unit, Date.now());
    saveSoon();
    syncStationSelect(idx, c.station);
  }
}
/* 자주 가는 충전소 드롭다운에서 골랐을 때 — 이름·유종·단가를 채우고 금액까지 계산한다. */
function onStationPick(el){
  var key = el.getAttribute('data-day');
  var idx = Number(el.getAttribute('data-station'));
  if(!key) return;
  var d = state.days[key];
  if(!d || !d.charges || !d.charges[idx]) return;
  var c = d.charges[idx];
  var name = el.value;
  if(!name){ render(); return; }
  var st = findStation(state.settings, name);
  if(!st){ render(); return; }
  d.u = Date.now();
  applyStation(c, st);
  rememberStation(state.settings, c.station, c.fuel, c.unit, Date.now());
  saveSoon();
  render();
  if(num(st.unit) > 0){
    toast(st.name + ' 단가 ' + fmtNum(num(st.unit)) + '원/L 적용'
      + (num(c.amount) > 0 ? ' · ' + fmtNum(num(c.amount)) + '원' : ''));
  }
}
function updateDayComputeds(key){
  var d = state.days[key];
  if(!d) return;
  var now = Date.now();
  var work = dayWorkMinutes(d, now);
  var inc = incomeOf(d);
  setText('workTotal', fmtDur(work));
  setText('hourlyRev', work > 0 ? (fmtNum(inc.sales/(work/60)) + '원') : '－');
  setText('salesTotal', fmtWon(inc.sales));
  var ch = chargeTotals(d);
  setText('expTotal', fmtWon(expenseTotal(d)));
  setText('chargeTotal', fmtWon(ch.amount) + ' · ' + fmtNum(ch.liters) + 'L');
  var km = num(d.distance && d.distance.total), biz = num(d.distance && d.distance.business);
  setText('rideRate', km > 0 ? (round1(biz/km*100) + '%') : '－');
  var warnEl = document.getElementById('runWarn');
  var warn = '';
  (d.runs || []).forEach(function(r){
    var s = parseDT(r.s), e = parseDT(r.e);
    /* 같은 날 종료가 더 이르면 자정을 넘긴 운행으로 계산하므로 경고하지 않는다. */
    if(s && e && e.getTime() <= s.getTime() && !isOvernightRun(r)) warn = '종료 시각이 시작보다 빠릅니다. 날짜를 확인해 주세요.';
  });
  if(warnEl){ warnEl.textContent = warn; warnEl.style.display = warn ? '' : 'none'; }
}
function shiftDate(delta){
  var d = keyDate(ui.date);
  d.setDate(d.getDate() + delta);
  ui.date = dateKey(d);
  render();
}
function handleAct(act, el){
  var key, d, idx;
  switch(act){
    case 'nav': go(el.getAttribute('data-screen')); break;
    case 'start': doStart(); break;
    case 'stop': doStop(); break;
    case 'goInputToday': ui.screen = 'input'; ui.date = state.session ? state.session.dayKey : todayKey(); render(); break;
    case 'prevDay': shiftDate(-1); break;
    case 'nextDay': shiftDate(1); break;
    case 'today': ui.date = todayKey(); render(); break;
    case 'openDay': ui.date = el.getAttribute('data-key'); ui.screen = 'input'; render(); try{ window.scrollTo(0,0); }catch(e){} break;

      ui.courseKey = el.getAttribute('data-key') || '';

      break;

    case 'delRun':

    case 'addExp': d = touchDay(ui.date); d.expenses.push({id:'e'+Date.now(), cat:'식비', pay:'카드', amount:'', memo:''}); saveSoon(); render(); break;

      d = state.days[ui.date];
      if(d && d.expenses.length > idx){ d.expenses.splice(idx, 1); d.u = Date.now(); saveNow(); render(); }
      break;
    case 'addCharge': {
      d = touchDay(ui.date);
      var lastSt = lastStation(state.settings, state.days);
      var nc = {id:'c'+Date.now(), station:'', fuel: state.settings.fuel, liters:'', unit:'', amount:''};
      if(lastSt){
        nc.station = lastSt.name;
        if(lastSt.fuel) nc.fuel = lastSt.fuel;
        if(num(lastSt.unit) > 0) nc.unit = Math.round(num(lastSt.unit));

        d.photos = (d.photos||[]).filter(function(x){ return x.id !== el.getAttribute('data-pid'); });

      toast('제미나이 설정을 저장했습니다');

    case 'signIn': signIn(); break;

/* ---------- 운행 도우미: 인앱 오버레이 ---------- */
var APP_TITLE = 'taxi-log · 개인택시 운행관리';
var HELPERS = {
  night: {file:'./night.html', label:'🌙 심야 화장실·충전소', title:'심야 화장실·충전소 · taxi-log'},
  spots: {file:'./spots.html', label:'💰 돈 되는 자리 TOP 3', title:'서울 돈 되는 자리 · taxi-log'}
};
var helperTool = '', helperPushed = false;

/* 도우미 앱이 쓰는 저장소 키 — 같은 주소(도메인)에서 열리면 localStorage를 함께 쓴다.
   night.html → night.settings.v1 {opinetKey, opinetProxy}
   spots.html → sjd_ai {provider, key, model} */
var HELPER_NIGHT_KEY = 'night.settings.v1';
var HELPER_SPOTS_KEY = 'sjd_ai';
var HELPER_NIGHT_PROXY = 'https://opinet-proxy.love1004kl.workers.dev';

function readKeyJson(key){
  try{
    var raw = localStorage.getItem(key);
    if(!raw) return null;
    var v = JSON.parse(raw);
    return (v && typeof v === 'object') ? v : null;
  }catch(e){ return null; }
}
function writeKeyJson(key, obj){
  try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){}
}
/* 설정에 넣어 둔 오피넷 키·중계 주소, 제미나이 키·모델을 도우미 앱에도 맞춰 둔다.
   도우미 앱에서 직접 고친 값(다른 AI 제공자, 다른 모델, 즐겨찾기)은 건드리지 않는다. */
function syncHelperKeys(){
  if(!state || !state.settings) return;
  var s = state.settings;
  var opinetKey = String(s.opinetKey || '').trim();
  var proxy = String(s.opinetProxyUrl || '').trim();
  var night = readKeyJson(HELPER_NIGHT_KEY) || {};
  var nightChanged = false;
  if(opinetKey && night.opinetKey !== opinetKey){ night.opinetKey = opinetKey; nightChanged = true; }
  if(proxy && night.opinetProxy !== proxy){ night.opinetProxy = proxy; nightChanged = true; }
  if(!night.opinetProxy && HELPER_NIGHT_PROXY){ night.opinetProxy = HELPER_NIGHT_PROXY; nightChanged = true; }
  /* 지도 키도 도우미 앱(night.html 로드뷰 등)이 같은 값으로 쓸 수 있게 넘긴다. */
  var gmapsKey = String(s.gmapsKey || '').trim();
  if(gmapsKey && night.gmapsKey !== gmapsKey){ night.gmapsKey = gmapsKey; nightChanged = true; }
  if(nightChanged) writeKeyJson(HELPER_NIGHT_KEY, night);
  try{
    if(gmapsKey) localStorage.setItem('taxi_gmaps_key', gmapsKey);
    else localStorage.removeItem('taxi_gmaps_key');
  }catch(e){}

  var geminiKey = String(s.geminiKey || '').trim();
  var model = String(s.geminiModel || '').trim();
  if(!geminiKey) return;
  var ai = readKeyJson(HELPER_SPOTS_KEY) || {};
  if(ai.provider && ai.provider !== 'gemini') return;
  var aiChanged = false;
  if(ai.key !== geminiKey){
    ai.key = geminiKey;
    ai.provider = 'gemini';
    if(model) ai.model = model;
    aiChanged = true;
  } else if(!ai.model && model){
    ai.model = model;
    aiChanged = true;
  }
  if(aiChanged) writeKeyJson(HELPER_SPOTS_KEY, ai);
}
function helperEl(id){ return document.getElementById(id); }
function openHelper(tool){
  var cfg = HELPERS[tool];
  if(!cfg) return;
  helperTool = tool;
  syncHelperKeys();
  var box = helperEl('helperView'), frame = helperEl('helperFrame');
  var title = helperEl('helperTitle'), load = helperEl('helperLoad');
  if(title) title.textContent = cfg.label;
  if(load) load.classList.remove('hide');
  if(frame){
    if(frame.getAttribute('data-tool') !== tool){
      frame.setAttribute('data-tool', tool);
      frame.setAttribute('title', cfg.label);
      frame.setAttribute('src', cfg.file);
    }
  }
  if(box){ box.classList.add('show'); box.setAttribute('aria-hidden', 'false'); }
  document.body.classList.add('helper-open');
  document.title = cfg.title;
  try{
    if(typeof history !== 'undefined' && history && history.pushState){
      history.pushState({helper: tool}, '');
      helperPushed = true;
    }
  }catch(e){}
}
function closeHelper(keepHistory){
  var box = helperEl('helperView');
  if(box){ box.classList.remove('show'); box.setAttribute('aria-hidden', 'true'); }
  if(document.body && document.body.classList) document.body.classList.remove('helper-open');
  document.title = APP_TITLE;
  helperTool = '';
  if(!keepHistory && helperPushed){
    helperPushed = false;
    try{ if(typeof history !== 'undefined' && history && history.back) history.back(); }catch(e){}
  }
}
function openHelperExternal(){
  var cfg = HELPERS[helperTool || 'night'];
  if(!cfg) return;
  try{
    if(typeof window !== 'undefined' && window && window.open){
      window.open(cfg.file, '_blank');
      return;
    }
  }catch(e){}
  toast('새 탭을 열지 못했습니다. 브라우저 주소창에 ' + cfg.file + ' 를 직접 입력해 열어 주세요.');
}
function helperFrameLoaded(){
  var load = helperEl('helperLoad');
  if(load) load.classList.add('hide');
}

/* ---------- 시계 ---------- */
function tick(){
  if(!state || !state.session) return;
  var st = parseDT(state.session.start);
  if(!st) return;
  var ms = Date.now() - st.getTime();
  setText('elapsedClock', fmtClock(ms));
  var sub = document.getElementById('runSub');
  if(sub) sub.textContent = hm(state.session.start) + ' 시작 · ' + fmtDur(ms/60000) + ' 경과';
  var chip = document.getElementById('liveChip');
  if(chip) chip.textContent = '운행 중 ' + fmtClock(ms);
  var tod = document.getElementById('todayWork');
  if(tod){
    var td = state.days[state.session.dayKey || todayKey()];
    var tm = dayWorkMinutes(td, Date.now());
    tod.innerHTML = Math.floor(tm/60) + '<span class="unit">h</span> ' + pad2(tm%60) + '<span class="unit">m</span>';
  }
}

/* ---------- 시작 ---------- */
function boot(){
  checkStorage();
  loadAll();
  initUi();
  syncHelperKeys();
  ui.date = todayKey();
  if(state.session) startGeo();
  render();
  setInterval(tick, 1000);
  if(syncMeta.email) setTimeout(autoReconnect, 1500);
  document.addEventListener('click', function firstTouch(){
    document.removeEventListener('click', firstTouch);
    if(syncMeta.email && (!accessToken || Date.now() > tokenExp)) autoReconnect();
  });
  window.addEventListener('pagehide', function(){
    clearTimeout(saveTimer);
    saveTimer = null;
    saveLocal();
  });
  window.addEventListener('beforeunload', function(){ clearTimeout(saveTimer); saveTimer = null; saveLocal(); });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      if(state.session && gpsState.watch === null) startGeo();
      if(ui.screen === 'home') refreshHomeCourse();
      updateGpsLine();
    } else {
      flushSave();
    }
  });
  window.addEventListener('online', function(){ if(syncMeta.email) scheduleAutoSync(); });
  window.addEventListener('offline', function(){ /* 로컬 저장은 계속 */ });
  window.addEventListener('popstate', function(){ helperPushed = false; if(helperTool) closeHelper(true); });
  document.addEventListener('keydown', function(ev){
    if(!ev || ev.key !== 'Escape') return;
    if(calcUI.open){ calcCancel(); return; }
    if(clockUI.open){ clockCancel(); return; }
    if(helperTool) closeHelper();
  });
  document.addEventListener('touchstart', function(ev){
    if(!ui || ui.screen !== 'home') return;
    var t = ev && ev.target;
    if(!t || !t.closest || !t.closest('#sumView')) return;
    if(!ev.touches || ev.touches.length !== 1) return;
    sumDrag = {x: ev.touches[0].clientX, y: ev.touches[0].clientY, dx: 0, dy: 0, active: true};
  }, {passive:true});
  document.addEventListener('touchmove', function(ev){
    if(!sumDrag.active || !ev.touches || ev.touches.length !== 1) return;
    sumDrag.dx = ev.touches[0].clientX - sumDrag.x;
    sumDrag.dy = ev.touches[0].clientY - sumDrag.y;
  }, {passive:true});
  document.addEventListener('touchend', sumSwipeFinish);
  document.addEventListener('touchcancel', function(){ sumDrag.active = false; });
  var hframe = helperEl('helperFrame');
  if(hframe && hframe.addEventListener) hframe.addEventListener('load', helperFrameLoaded);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
