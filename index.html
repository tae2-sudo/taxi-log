<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>taxi-log · 개인택시 운행관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305140F'/%3E%3Ctext x='32' y='45' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%ED%83%9D%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0B1120;--bg-deep:#05080F;--surface:#131C31;--surface2:#1A2539;--surface3:#0F172A;
  --line:#243049;--line-soft:#1B2540;
  --text:#E8EDF5;--muted:#8391A7;--dim:#5D6B84;
  --emerald:#10B981;--emerald-2:#34D399;--emerald-ink:#05261A;
  --amber:#F59E0B;--amber-2:#F5B342;--amber-ink:#2B1A00;
  --sky:#60A5FA;--rose:#F87171;
  --r:20px;--r-sm:14px;--shadow:0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#05080F}
body{
  margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 460px at 50% -14%,#17243d 0%,#0B1120 46%,#070B15 100%) no-repeat,#070B15;
  background-attachment:fixed;
  color:var(--text);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit}
a{color:var(--emerald-2);text-decoration:none}
h1,h2,h3,p{margin:0}
::selection{background:rgba(16,185,129,.28)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-variant-numeric:tabular-nums}

/* ---------- 상단 바 ---------- */
.app-header{position:sticky;top:0;z-index:30;background:rgba(11,17,32,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line-soft);
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(140deg,#1E3A5F,#131C31);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--emerald-2)}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand .sub{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate-chip{font-size:11px;font-weight:700;color:var(--text);background:var(--surface2);border:1px solid var(--line);
  padding:6px 10px;border-radius:999px;white-space:nowrap;flex:0 0 auto;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.plate-chip svg{width:13px;height:13px;color:var(--muted)}

/* ---------- 레이아웃 ---------- */
main{padding:6px 16px calc(104px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.screen-title{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:10px 2px 14px}
.screen-title h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
.screen-title .date-line{font-size:13px;font-weight:600;color:var(--muted)}
.screen-title .date-line span{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.spacer{flex:1}

/* ---------- 카드 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.tight{padding:13px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.card-t{font-size:14px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.card-t::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--emerald);display:inline-block}
.card-sub{font-size:12px;color:var(--muted);font-weight:600}
.section-h{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
.section-h h2{font-size:15px;font-weight:800;letter-spacing:-.02em}
.section-h a,.section-h .sec-meta{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:2px}
.section-h svg{width:14px;height:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{flex-wrap:wrap}

/* ---------- 버튼 ---------- */
.btn{min-height:44px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;cursor:pointer;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,#34D399,#10B981);border-color:transparent;color:var(--emerald-ink);font-weight:800}
.btn-green{background:linear-gradient(135deg,#34D399,#10B981);border-color:transparent;color:var(--emerald-ink)}
.btn-red{background:linear-gradient(135deg,#FBBF24,#F59E0B);border-color:transparent;color:var(--amber-ink);font-weight:800}
.btn-soft{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.22);color:var(--emerald-2)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--emerald-2)}
.btn-danger-ghost{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.22);color:var(--rose)}
.btn-sm{min-height:34px;font-size:12.5px;padding:0 11px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;cursor:default;transform:none}
.btn svg{width:16px;height:16px}

/* ---------- 홈 ---------- */
.home-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 2px 14px}
.home-head .date{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.home-head .hello{font-size:23px;font-weight:800;letter-spacing:-.035em;margin-top:3px;line-height:1.2}
.home-head .hello em{font-style:normal;color:var(--emerald-2)}
.veh-badge{width:46px;height:46px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;color:#9FB0C7;flex:0 0 auto;position:relative}
.veh-badge svg{width:22px;height:22px}
.veh-badge .live-dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--amber);
  border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(245,158,11,.18)}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.summary .card{margin-bottom:0;padding:15px 16px}
.summary .card.hero{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
  background:linear-gradient(135deg,#182642 0%,#131C31 62%);border-color:#26334d;border-radius:22px;padding:18px}
.label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.label svg{width:14px;height:14px}
.value{font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.03em;white-space:nowrap}
.card.hero .value{font-size:32px;letter-spacing:-.045em;color:#F4F8FF}
.unit{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:2px;letter-spacing:0}
.card.hero .unit{font-size:15px;color:#9FB0C7;margin-left:4px}
.card.hero .sub{margin-top:6px;font-size:12px;color:#93A2B9}
.sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.amber{color:var(--amber-2)}
.emerald{color:var(--emerald-2)}
.chip{font-size:11.5px;font-weight:700;color:var(--emerald-2);background:rgba(52,211,153,.1);
  border:1px solid rgba(52,211,153,.16);padding:5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.off{color:var(--amber-2);background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.18)}
.chip.red{color:var(--rose);background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.18)}

.drive{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;margin-bottom:14px}
.elapsed-label{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.running .dot{background:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.16);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(245,158,11,0)}}
.elapsed{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1.12;margin-top:2px;font-variant-numeric:tabular-nums}
.running .elapsed{color:var(--amber-2)}
.btn-wrap{position:relative;margin:20px 0 22px;display:grid;place-items:center}
.ring{position:absolute;width:232px;height:232px;border-radius:50%;border:1px solid rgba(52,211,153,.16);pointer-events:none}
.running .ring{border-color:rgba(245,158,11,.22);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.055);opacity:.55}}
.toggle{width:190px;height:190px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#5CEBB8,#10B981 72%);color:var(--emerald-ink);
  box-shadow:0 18px 46px rgba(16,185,129,.32),inset 0 -6px 16px rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-family:inherit;transition:transform .12s ease,background .3s;touch-action:manipulation}
.toggle:active{transform:scale(.96)}
.toggle:focus-visible{outline:3px solid #fff;outline-offset:6px}
.toggle svg{width:32px;height:32px}
.toggle .t{font-size:30px;font-weight:800;letter-spacing:.05em}
.toggle .s{font-size:11.5px;font-weight:700;opacity:.7}
.running .toggle{background:radial-gradient(circle at 35% 30%,#FFD27A,#F59E0B 72%);color:var(--amber-ink);
  box-shadow:0 18px 46px rgba(245,158,11,.3),inset 0 -6px 16px rgba(0,0,0,.16)}
.times{display:grid;grid-template-columns:1fr 1px 1fr;width:100%;max-width:340px;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:12px 0}
.times .div{background:var(--line)}
.times .t{text-align:center}
.times .k{font-size:11.5px;color:var(--muted);font-weight:600}
.times .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.times .v.empty{color:#3F4C64}
.run-sub{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px;min-height:18px}

/* ---------- 지도 ---------- */
.map{padding:0;overflow:hidden}
.map-view{position:relative}
.map-box{height:170px;width:100%}
.map-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;
  font-size:12px;color:var(--muted);background:linear-gradient(160deg,#101a2e,#131C31);line-height:1.55}
.map-msg.hide{display:none}
.map-msg.err{background:rgba(245,158,11,.07);color:#E9B66A}
.map-hint{background:linear-gradient(160deg,#101a2e,#131C31);border:1px dashed var(--line);border-radius:14px;padding:16px;
  font-size:12px;color:var(--muted);line-height:1.6}
.map-wrap{position:relative;border-radius:0;overflow:hidden;background:#0F172A}
.map-stats{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 16px 4px;gap:6px}
.map-stats .k{font-size:11px;color:var(--muted);font-weight:600}
.map-stats .v{font-size:16px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.map-stats .v.hi{color:var(--emerald-2)}
.map-foot{padding:10px 14px 14px}
.gpin{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.gpin i{transform:rotate(-45deg);font-style:normal;font-size:11px;font-weight:800;color:#fff;font-family:-apple-system,sans-serif}

/* ---------- 운행 코스 카드 ---------- */
.course-card{padding:0;overflow:hidden}
.course-head{display:flex;align-items:center;gap:6px;padding:11px 10px}
.course-nav{width:34px;height:34px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line-soft);background:var(--surface3);
  color:var(--muted);font-size:16px;font-weight:800;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.course-nav:active{background:var(--surface2);color:var(--text)}
.course-nav[disabled]{opacity:.25}
.course-date{flex:1;text-align:center;min-width:0}
.course-date b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.course-date span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.course-card .map-hint{margin:0;border:0;border-radius:0;padding:26px 16px;text-align:center}
.course-map{position:relative;background:#0B1120;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.course-map .map-box{height:208px}
.map-svg-box{background:
  repeating-linear-gradient(0deg,rgba(36,48,73,.5) 0 1px,transparent 1px 36px),
  repeating-linear-gradient(90deg,rgba(36,48,73,.5) 0 1px,transparent 1px 36px),
  linear-gradient(180deg,#12203A,#0C1526)}
.route-svg{display:block;width:100%;height:100%}
.course-sum{display:grid;grid-template-columns:1fr 1px 1fr;align-items:stretch;background:var(--surface3)}
.course-sum .div{background:var(--line-soft);margin:9px 0}
.course-sum .cs{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;min-width:0}
.course-sum .cs .ico{font-size:15px;line-height:1;opacity:.95;flex:0 0 auto}
.course-sum .cs .txt{min-width:0;text-align:left}
.course-sum .cs .k{display:block;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:-.01em}
.course-sum .cs .v{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.course-sum .cs .v .u{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:1px}
.course-sum .cs .sub{display:block;font-size:10.5px;color:var(--dim);font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.course-tl{padding:13px 15px 2px}
.ct{display:grid;grid-template-columns:16px 1fr;gap:11px}
.ct + .ct{margin-top:13px}
.ct-rail{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.ct-dot{width:9px;height:9px;border-radius:50%;background:#0B1120;border:2.5px solid #EF4444;flex:0 0 auto}
.ct-dot.end{border-color:#60A5FA}
.ct-line{flex:1;width:2px;border-radius:2px;margin-top:5px;margin-bottom:-13px;min-height:20px;
  background:linear-gradient(180deg,rgba(239,68,68,.5),rgba(96,165,250,.32))}
.ct-body{min-width:0;padding-bottom:1px}
.ct-k{font-size:12px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.ct-d{font-size:14px;font-weight:700;color:#C6D2E2;margin-top:1px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ct-loc{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.course-foot{padding:11px 14px 13px}

/* ---------- 월간 요약 ---------- */
.sum-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.sum-card .sum-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.sum-card .big{font-size:27px;font-weight:800;letter-spacing:-.04em;margin:5px 0 12px;font-variant-numeric:tabular-nums}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-item{background:var(--surface3);border:1px solid var(--line-soft);border-radius:12px;padding:9px 10px}
.sum-item .k{font-size:10.5px;color:var(--muted);font-weight:600}
.sum-item .v{font-size:13.5px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sum-hi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.sum-hi .k{font-size:11px;color:var(--muted);font-weight:600}
.sum-hi .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.sum-foot{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
.sum-foot b{color:var(--text);font-variant-numeric:tabular-nums}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--surface3);border:1px solid var(--line-soft);border-radius:13px;padding:10px 8px;text-align:center}
.kpi .v{font-size:14.5px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kpi .v.money{font-size:12.5px;letter-spacing:-.04em;white-space:nowrap}
.kpi .v.time{font-size:12.5px;letter-spacing:-.03em;white-space:nowrap}
.kpi .v.hi{color:var(--emerald-2)}
.kpi .v.amber{color:var(--amber-2)}
.kpi .v.sky{color:var(--sky)}
.kpi .l{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}

/* ---------- 폼 ---------- */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:11.5px;color:var(--muted);font-weight:600}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--surface3);
  border:1px solid var(--line);border-radius:11px;padding:9px 10px;min-height:42px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:#4E5C74}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(52,211,153,.4);outline-offset:0;border-color:rgba(52,211,153,.55)}
input.num,select.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=datetime-local],input[type=month],input[type=date]{font-size:13.5px;padding:8px 8px;color-scheme:dark}
.field .unit{position:relative}
.field .unit input{padding-right:34px}
.field .unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);font-weight:700}

.seg{display:flex;background:var(--surface3);border:1px solid var(--line-soft);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:32px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface2);color:var(--emerald-2);box-shadow:0 1px 3px rgba(0,0,0,.35)}

.hint-box{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.18);border-radius:13px;padding:11px 12px;font-size:12px;color:#B9C7DA;line-height:1.6}
.hint-box b{color:#DCE6F5}
.warn-box{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.24);border-radius:13px;padding:11px 12px;font-size:12px;color:#EFC077;line-height:1.6}
.warn-box b{color:#FFD79A}
.ok-box{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.24);border-radius:13px;padding:11px 12px;font-size:12px;color:#8FE5C2;line-height:1.6}

.run-row{border:1px solid var(--line-soft);border-radius:13px;padding:11px;margin-bottom:8px;background:var(--surface3)}
.run-row .rr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.run-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line-soft);border-radius:13px;padding:11px;margin-bottom:8px;background:var(--surface3);position:relative}
.list-row .full{grid-column:1 / -1}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.list-head b{font-size:12px;color:var(--muted);font-weight:700}
.del-x{border:0;background:rgba(255,255,255,.05);color:var(--muted);width:28px;height:28px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;line-height:1}
.del-x:active{background:rgba(255,255,255,.1)}
.station-pick{display:flex;flex-direction:column;gap:6px}
.station-pick select{font-size:13.5px;font-weight:700}
.st-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line-soft);border-radius:11px;padding:9px 10px;margin-bottom:6px;background:var(--surface3)}
.st-row .st-name{font-size:13px;font-weight:700;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row .st-unit{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--emerald-2);font-variant-numeric:tabular-nums;flex:none}

.total-line{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface3);border:1px solid var(--line-soft);border-radius:11px;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.total-line b{font-size:14.5px;color:var(--text);font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);font-weight:600;margin-top:9px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}

.off-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;padding:13px;border:1px dashed var(--line);background:var(--surface3)}
.off-toggle.on{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.28)}
.off-toggle .t{font-size:13.5px;font-weight:800}
.off-toggle .s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- 달력 ---------- */
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.cal-dow div{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal-dow div:first-child{color:#F08A8A}
.cal-dow div:last-child{color:var(--sky)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{min-height:74px;border-radius:10px;background:var(--surface3);border:1px solid var(--line-soft);padding:4px 2px 3px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;overflow:hidden}
.cell.empty{background:transparent;border-color:transparent;cursor:default}
.cell .d{font-size:11px;font-weight:700;color:#A9B6C9;line-height:1.1}
.cell.sun .d{color:#F08A8A}
.cell.sat .d{color:var(--sky)}
.cell .hr{font-size:9px;font-weight:800;background:rgba(52,211,153,.16);color:var(--emerald-2);border-radius:5px;padding:0 3px;line-height:14px;letter-spacing:-.2px;white-space:nowrap}
.cell .amt{font-size:9px;line-height:1.14;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.cell .amt.sales{color:var(--emerald-2);font-weight:800}
.cell .amt.kcard{color:var(--sky);font-weight:700}
.cell .amt.kcash{color:#A9B6C9;font-weight:700}
.cell.pat{background:rgba(255,255,255,.035)}
.cell.off{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.18)}
.cell.today{outline:2px solid rgba(52,211,153,.7);outline-offset:-2px}

.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:2px -4px 0;padding-bottom:2px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.chart-scroll::-webkit-scrollbar,.table-wrap::-webkit-scrollbar{height:6px}
.chart-scroll::-webkit-scrollbar-thumb,.table-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.chart-scroll::-webkit-scrollbar-track,.table-wrap::-webkit-scrollbar-track{background:transparent}
.chart-scroll svg{display:block;width:100%;min-width:600px;height:auto}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;font-weight:600;color:var(--muted);margin:8px 2px 0}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
table.data{border-collapse:collapse;width:100%;font-size:12px;min-width:560px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:8px 6px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap;color:#C6D2E2}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data thead th{color:var(--muted);font-weight:700;background:var(--surface3);position:sticky;top:0}
table.data tfoot td{font-weight:800;background:var(--surface3);color:var(--text)}
table.data td.red{color:var(--emerald-2);font-weight:700}
table.data td.blue{color:var(--sky)}

/* ---------- 사진 · 검색 · 설정 ---------- */
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.photo{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--surface3)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .x{position:absolute;top:3px;right:3px;border:0;background:rgba(5,8,15,.72);color:#fff;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:800;line-height:1;cursor:pointer}
.photo-btn{display:inline-flex;align-items:center;gap:6px}
.search-result{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.search-result:last-child{border-bottom:0}
.search-result .dt{font-size:11.5px;font-weight:700;color:var(--emerald-2);white-space:nowrap}
.search-result .tx{font-size:12px;color:#B9C7DA;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings-block{border-top:1px solid var(--line-soft);margin-top:14px;padding-top:14px}
.settings-block:first-of-type{border-top:0;margin-top:0;padding-top:0}
.settings-block h3{font-size:13.5px;font-weight:800;color:var(--text);margin-bottom:9px;letter-spacing:-.01em}
.week-btns{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-btns button{min-height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface3);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.week-btns button.on{background:linear-gradient(135deg,#34D399,#10B981);border-color:transparent;color:var(--emerald-ink);font-weight:800}
.week-btns button.sun.on{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:var(--amber-ink)}
.week-btns button.sat.on{background:linear-gradient(135deg,#60A5FA,#3B82F6);color:#04121F}
.stor-meter{height:8px;border-radius:99px;background:var(--surface3);border:1px solid var(--line-soft);overflow:hidden;margin:8px 0 4px}
.stor-meter i{display:block;height:100%;background:linear-gradient(90deg,#34D399,#10B981);width:0}

/* ---------- 하단 탭 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,17,32,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:#5D6B84;font-weight:700;min-height:52px;cursor:pointer;justify-content:center}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--text)}
.tab.active svg{color:var(--emerald-2)}
.tab.plus .ico{width:46px;height:46px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--amber-2);margin-top:-16px;box-shadow:0 8px 18px rgba(0,0,0,.4)}
.tab.plus .ico svg{width:22px;height:22px}
.tab.plus.active .ico{border-color:rgba(52,211,153,.45);color:var(--emerald-2);background:rgba(52,211,153,.1)}
.tab.plus.active svg{color:var(--emerald-2)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);
  background:rgba(26,37,57,.97);border:1px solid var(--line);color:var(--text);font-size:12.5px;font-weight:600;
  padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;
  max-width:calc(100vw - 40px);text-align:center;line-height:1.45;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal{position:fixed;inset:0;background:rgba(4,7,13,.94);display:none;align-items:center;justify-content:center;z-index:70;padding:18px}
.modal.show{display:flex}
.modal img{max-width:100%;max-height:86vh;border-radius:12px}
.modal .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:19px;font-weight:700;cursor:pointer}

/* ---------- 운행 도우미: 홈 퀵 메뉴 ---------- */
.helper-wrap{margin:2px 0 4px}
.helper-grid{display:grid;gap:10px}
.helper-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#1A2841 0%,#131C31 68%);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;min-height:68px;color:var(--text);box-shadow:var(--shadow)}
.helper-btn:active{transform:translateY(1px)}
.helper-btn:focus-visible{outline:2px solid var(--emerald-2);outline-offset:2px}
.helper-btn .hb-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:0 0 auto;line-height:1;
  background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.26)}
.helper-btn.spots .hb-ico{background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.3)}
.helper-btn .hb-txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.helper-btn .hb-txt b{font-size:14.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.helper-btn .hb-txt i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.helper-btn .hb-go{font-size:21px;font-weight:700;color:var(--dim);flex:0 0 auto;line-height:1}

/* ---------- 운행 도우미: 전체화면 오버레이 ---------- */
.helper-view{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;background:var(--bg-deep)}
.helper-view.show{display:flex}
body.helper-open{overflow:hidden}
.helper-bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:rgba(9,14,26,.97);
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.helper-bar .hb-back{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:11px;cursor:pointer;
  background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.26);color:var(--emerald-2);
  font-size:12.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;flex:0 0 auto}
.helper-bar .hb-back:active{transform:translateY(1px)}
.helper-bar .hb-title{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:700;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.helper-bar .hb-ext{width:36px;height:36px;border-radius:11px;flex:0 0 auto;cursor:pointer;display:grid;place-items:center;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:15px;line-height:1}
.helper-body{position:relative;flex:1;min-height:0;background:var(--bg-deep)}
.helper-body iframe{display:block;width:100%;height:100%;border:0;background:var(--bg-deep)}
.helper-load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg-deep);
  color:var(--muted);font-size:12.5px;font-weight:600;pointer-events:none}
.helper-load.hide{display:none}
@media (max-width:400px){.helper-bar .hb-title{display:none}}

@media (min-width:560px){
  main{max-width:600px;padding-left:20px;padding-right:20px}
  .app-header{padding-left:calc((100vw - 600px)/2 + 20px);padding-right:calc((100vw - 600px)/2 + 20px)}
  .tabbar{padding-left:calc((100vw - 600px)/2);padding-right:calc((100vw - 600px)/2)}
  .cell{min-height:84px}
  .cell .d{font-size:12px}
  .cell .hr{font-size:9.5px;line-height:15px}
  .cell .amt{font-size:10px}
  .map-box{height:200px}
}
@media (max-width:360px){
  .elapsed{font-size:40px}
  .toggle{width:172px;height:172px}
  .ring{width:212px;height:212px}
  .card.hero .value{font-size:28px}
  .kpi .v{font-size:13px}
  .cell{min-height:64px}
  .run-fields{grid-template-columns:1fr}
}
@media print{.tabbar,.app-header{display:none}body{background:#fff}}
.card.map .map-hint{border:0;border-radius:0}
.card.map .map-wrap{border-radius:0}

/* ---------- 영업달력 (얇은 격자 · 스샷 구성) ---------- */
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 12px}
.cal-month{display:flex;align-items:center;gap:4px;min-width:0}
.cal-month b{font-size:19px;font-weight:800;letter-spacing:-.03em;padding:0 2px;white-space:nowrap}
.cal-nav{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-soft);background:transparent;color:var(--muted);
  font-size:11px;font-weight:800;cursor:pointer;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.cal-nav:active{background:var(--surface2);color:var(--text)}
.cal-sel{border:0;background:none;color:#C6D2E2;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  padding:6px 2px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.cal-sel .caret{font-size:10px;color:var(--muted)}
.cal-sum4{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px 2px 11px;border-bottom:1px solid var(--line)}
.cal-sum4 .cs{display:flex;flex-direction:column;gap:5px;min-width:0}
.cal-sum4 .k{font-size:11px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.cal-sum4 .v{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-sum4 .k-sales{color:var(--amber-2)}
.cal-sum4 .k-card{color:var(--sky)}
.cal-sum4 .k-cash{color:var(--muted)}
.cal-sum4 .k-out{color:#C6D2E2}
.cal-grid.thin{gap:0;margin-top:0;border-top:1px solid var(--line-soft)}
.cal-grid.thin .cell{min-height:70px;border-radius:0;background:transparent;border:0;border-bottom:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);padding:5px 3px 4px;align-items:flex-start;gap:1px;overflow:visible}
.cal-grid.thin .cell:nth-child(7n){border-right:0}
.cal-grid.thin .cell.empty{background:transparent;border-color:transparent transparent var(--line-soft) transparent}
.cal-grid.thin .cell .d{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.2;margin-bottom:1px}
.cal-grid.thin .cell.sun .d{color:#F08A8A}
.cal-grid.thin .cell.sat .d{color:var(--sky)}
.cal-grid.thin .cell.today{background:rgba(52,211,153,.10);outline:1.5px solid rgba(52,211,153,.55);outline-offset:-1.5px}
.cal-grid.thin .cell.off{background:rgba(245,158,11,.05)}
.cal-grid.thin .cell.pat{background:rgba(255,255,255,.02)}
.cal-grid.thin .cell .ln{font-size:8.5px;line-height:1.28;font-variant-numeric:tabular-nums;letter-spacing:-.35px;white-space:nowrap}
.cal-grid.thin .cell .ln.sales{color:var(--amber-2);font-weight:800}
.cal-grid.thin .cell .ln.kcard{color:var(--sky);font-weight:700}
.cal-grid.thin .cell .ln.cash{color:#A9B6C9;font-weight:700}
.cal-grid.thin .cell .ln.out{color:#8899AD;font-weight:600;font-size:8px;margin-top:1px}
.cal-grid.thin .cell .t-hours{font-size:9.5px;font-weight:800;color:var(--emerald-2);line-height:1.25;letter-spacing:-.2px}
.cal-foot-tip{font-size:11px;color:var(--dim);font-weight:600;text-align:center;padding:10px 4px 2px}
@media (max-width:360px){
  .cal-sum4 .v{font-size:12.5px}
  .cal-grid.thin .cell{min-height:62px;padding:4px 2px 3px}
  .cal-grid.thin .cell .ln{font-size:8px;letter-spacing:-.4px}
}
@media (min-width:560px){
  .cal-grid.thin .cell{min-height:86px}
  .cal-grid.thin .cell .ln{font-size:10px}
  .cal-grid.thin .cell .d{font-size:12.5px}
}

/* ---------- 홈: 수입·지출 / 주행 / 충전 ---------- */
.sum-blocks-wrap{margin:2px 0 14px}
.sum-blocks-wrap .sb-page{display:block}
.sum-blocks-wrap .sb-page[data-page-view="1"]{display:none}
.sum-blocks-wrap.year .sb-page[data-page-view="0"]{display:none}
.sum-blocks-wrap.year .sb-page[data-page-view="1"]{display:block}
.sum-blocks{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 14px;box-shadow:var(--shadow)}
.sb-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}
.sb-period{font-size:12px;font-weight:800;color:var(--emerald-2);letter-spacing:-.01em}
.sb-work{font-size:11.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.sb-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:12px 0 7px}
.sb-h span{font-size:12.5px;font-weight:800;color:#C6D2E2;letter-spacing:-.01em}
.sb-h .sb-net{font-size:12.5px;font-weight:800;color:var(--emerald-2);font-variant-numeric:tabular-nums}
.sb-h .sb-eco{font-size:12.5px;font-weight:800;color:var(--amber-2);font-variant-numeric:tabular-nums}
.sb-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sb-box{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.22);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.sb-box.out{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.22)}
.sb-box .bk{font-size:11px;font-weight:700;color:var(--muted)}
.sb-box .bv{font-size:15px;font-weight:800;color:#EAF1FB;letter-spacing:-.03em}
.sb-box.in .bv{color:#BFDBFE}
.sb-box.out .bv{color:#FCA5A5}
.sb-cell{background:var(--surface3);border:1px solid var(--line-soft);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sb-cell .ck{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.sb-cell .cv{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-cell .cv .u,.sb-box .bv .u,.sb-h .sb-net .u{font-size:10.5px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}

/* ---------- 계산기 팝업 ---------- */
.sheet{position:fixed;inset:0;z-index:72;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(4,7,13,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet.show{display:flex}
body.sheet-open{overflow:hidden}
.sheet-panel{width:100%;max-width:360px;background:linear-gradient(180deg,#16223A 0%,#111A2C 100%);
  border:1px solid #2A3B5C;border-radius:20px;padding:14px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.calc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.calc-title{font-size:14.5px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.calc-unit{font-size:11.5px;color:var(--muted);font-weight:700}
.calc-screen{background:#0B1424;border:1px solid var(--line);border-radius:13px;padding:9px 12px;margin-bottom:11px;min-height:62px;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:2px}
.calc-expr{font-size:11.5px;color:var(--muted);font-weight:600;min-height:15px;letter-spacing:.02em;word-break:break-all;text-align:right}
.calc-now{font-size:27px;font-weight:800;color:#F4F8FF;letter-spacing:-.04em;line-height:1.12}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.calc-grid .ck{min-height:54px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);color:#EAF1FB;
  font-size:20px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1;font-variant-numeric:tabular-nums}
.calc-grid .ck:active{transform:translateY(1px);filter:brightness(1.15)}
.calc-grid .ck.op{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.3);color:#BFDBFE}
.calc-grid .ck.del{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.3);color:#FCA5A5;font-size:17px}
.calc-grid .ck.eq{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.34);color:var(--emerald-2)}
.calc-grid .ck.wide{grid-column:span 2}
.calc-foot{display:flex;gap:8px;margin-top:11px}
.calc-foot .btn{flex:1;min-height:46px;font-size:14px;font-weight:800}
.calc-cancel{background:var(--surface2)}
.calc-ok{}

/* ---------- 원형 시계 다이얼 ---------- */
.clock-panel{max-width:350px}
.clock-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.clock-title{font-size:14.5px;font-weight:800;color:var(--text)}
.clock-date{font-size:11px;color:var(--muted);font-weight:600}
.cd-next{color:var(--amber-2);font-weight:800}
.clock-time{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ct-box{flex:1;min-height:58px;border-radius:14px;border:1px solid var(--line);background:#0E1A2E;color:#F4F8FF;
  font-size:30px;font-weight:800;font-family:inherit;letter-spacing:-.04em;cursor:pointer;font-variant-numeric:tabular-nums}
.ct-box.on{background:rgba(96,165,250,.18);border-color:rgba(96,165,250,.42);color:#DBEAFE}
.ct-colon{font-size:26px;font-weight:800;color:var(--muted);padding-bottom:4px}
.ct-ampm{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.ct-ampm button{width:52px;min-height:27px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);
  color:var(--muted);font-size:11.5px;font-weight:800;font-family:inherit;cursor:pointer}
.ct-ampm button.on{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.34);color:var(--emerald-2)}
.clock-nudge{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 2px}
.clock-nudge button{min-height:26px;border-radius:8px;border:1px solid var(--line-soft);background:transparent;color:var(--muted);
  font-size:11px;font-weight:700;font-family:inherit;padding:0 9px;cursor:pointer}
.clock-nudge span{font-size:10.5px;color:var(--dim);font-weight:600}
.dial{position:relative;width:min(78vw,268px);aspect-ratio:1/1;margin:6px auto 2px;border-radius:50%;touch-action:none;user-select:none}
.dial-face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#12203A 0%,#0C1626 100%);border:1px solid #24334F}
.dial-hand{position:absolute;left:50%;top:50%;height:2px;background:linear-gradient(90deg,rgba(96,165,250,.15),var(--sky));
  transform-origin:0 50%;border-radius:2px;margin-top:-1px}
.dial-pin{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--sky);transform:translate(-50%,-50%);
  box-shadow:0 0 0 5px rgba(96,165,250,.16);pointer-events:none}
.dial-num{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:0;background:transparent;
  color:#C6D2E2;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1;font-variant-numeric:tabular-nums}
.dial-num.on{background:var(--sky);color:#04121F;font-weight:800}
.dial-hint{text-align:center;font-size:10.5px;color:var(--dim);font-weight:600;margin-top:2px}
.clock-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.clock-kb{min-height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);
  font-size:11.5px;font-weight:700;font-family:inherit;padding:0 10px;cursor:pointer}
.clock-foot .btn{min-height:42px;padding:0 20px;font-size:13.5px;font-weight:800}
.clock-kb-wrap{display:flex;flex-direction:column;gap:6px;padding:12px 2px}
.clock-kb-wrap label{font-size:11.5px;color:var(--muted);font-weight:600}
.clock-kb-wrap input{min-height:56px;font-size:24px;font-weight:800;text-align:center;letter-spacing:.06em}

/* ---------- 숫자·시간 입력칸 ---------- */
input.calc-input{cursor:pointer;background:var(--surface3);-webkit-tap-highlight-color:transparent}
input.calc-input:focus{outline:2px solid rgba(52,211,153,.45);outline-offset:1px}
.time-input{display:flex;align-items:center;gap:6px;min-height:44px;width:100%;padding:0 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface3);color:var(--text);font-family:inherit;font-size:15px;
  font-weight:800;letter-spacing:.02em;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.time-input .tv{flex:1}
.time-input.empty{color:var(--dim);font-weight:700}
.time-input .nextday,.overnight-tag{font-size:9.5px;font-weight:800;color:var(--amber-2);background:rgba(245,158,11,.16);
  border-radius:5px;padding:1px 5px;letter-spacing:0}
.save-hint{font-size:10.5px;font-weight:700;color:var(--emerald-2);opacity:0;transition:opacity .2s;font-variant-numeric:tabular-nums}
.save-hint.on{opacity:1}

/* ---------- 월간 요약 ---------- */
.month-card{background:linear-gradient(155deg,#1D3054 0%,#17253F 46%,#131C31 100%);border:1px solid #2A3B5C;border-radius:22px;padding:13px 16px 4px;margin-bottom:16px;box-shadow:0 16px 38px rgba(0,0,0,.34)}
.month-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.07)}
.month-head .mt{font-size:15px;font-weight:800;letter-spacing:-.01em}
.month-head .my{font-size:11.5px;color:#9FB0C7;font-weight:600;font-variant-numeric:tabular-nums}
.month-rows{display:flex;flex-direction:column}
.mrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.mrow:last-child{border-bottom:0;padding-bottom:9px}
.mrow .mk{font-size:13px;color:#A9B8CE;font-weight:600;flex:0 0 auto;padding-top:2px}
.mrow .mv{font-size:15px;font-weight:700;color:#EAF1FB;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-align:right;display:block}
.mrow .mv .u{font-size:11.5px;color:#93A3BE;font-weight:600;margin-left:3px}
.mrow .mv .note{display:block;font-size:10.5px;color:#7F90A9;font-weight:600;margin-top:3px;letter-spacing:0}
.mrow.major{padding:6px 0 10px;border-bottom:1px solid rgba(255,255,255,.09)}
.mrow.major .mk{font-size:13.5px;color:#DCE7F7;font-weight:700;padding-top:6px}
.mrow.major .mv{font-size:24px;font-weight:800;color:#F4F8FF;letter-spacing:-.035em}
.mrow .mv.hi{color:var(--emerald-2)}

/* ---------- 요약 카드: 월간 ↔ 연간 슬라이드 ---------- */
.sum-wrap{margin-bottom:16px}
.sum-view{overflow:hidden;border-radius:22px;box-shadow:0 16px 38px rgba(0,0,0,.34)}
.sum-track{display:flex;width:200%;transition:transform .3s cubic-bezier(.22,.61,.36,1);will-change:transform;touch-action:pan-y}
.sum-track.year{transform:translateX(-50%)}
.sum-page{width:50%;flex:0 0 50%;min-width:0}
.sum-page > .month-card{margin-bottom:0;box-shadow:none;height:100%}
.sum-dots{display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 0 2px}
.sum-dots .dot{width:7px;height:7px;border-radius:50%;padding:0;border:0;background:rgba(255,255,255,.2);cursor:pointer;transition:background .2s,transform .2s}
.sum-dots .dot.on{background:var(--emerald-2);transform:scale(1.2)}
.sum-dots .dot:focus-visible{outline:2px solid var(--emerald-2);outline-offset:3px}
.month-head button.mt{background:none;border:0;padding:0;font:inherit;font-size:15px;font-weight:800;letter-spacing:-.01em;color:#EAF1FB;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.month-head button.mt:active{opacity:.65}
@media (max-width:360px){.sum-dots{padding:8px 0 0}}

/* ---------- AI ---------- */
.ai-card{border-color:rgba(52,211,153,.22);background:linear-gradient(160deg,#152238,#131C31 60%)}
.ai-pick{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.ai-card textarea{min-height:74px;font-size:13.5px}
.ai-answer{font-size:13px;line-height:1.7;color:#CBD7E7}
.ai-answer p{margin:0 0 9px}
.ai-answer ul{margin:0 0 9px;padding-left:16px}
.ai-answer li{margin:3px 0}
.ai-answer b{color:#EAF1FB}

@media (max-width:430px){
  .home-head{margin:6px 2px 11px}
  .home-head .hello{font-size:21px}
  .month-card{padding:11px 15px 2px;margin-bottom:14px}
  .month-head{padding-bottom:9px}
  .mrow{padding:5px 0}
  .mrow.major{padding:4px 0 8px}
  .mrow.major .mk{font-size:12.5px;padding-top:5px}
  .mrow.major .mv{font-size:22px}
  .mrow .mk{font-size:12px}
  .mrow .mv{font-size:14px}
  .mrow .mv .note{font-size:10px;margin-top:2px}
  .drive{padding:0 0 2px}
  .elapsed{font-size:42px}
  .btn-wrap{margin:15px 0 17px}
  .toggle{width:172px;height:172px}
  .ring{width:210px;height:210px}
  .times{padding:10px 0}
  .times .v{font-size:18px}
}
</style>
</head>

<script>
"use strict";
/* ===== CORE START ===== */
var WEEKDAYS = ['일','월','화','수','목','금','토'];

function pad2(n){ n = Number(n)||0; return (n<10?'0':'')+n; }
/* 입력칸·AI·동기화에서 온 값을 숫자로 읽는다.
   "354,800" · "354,800원" · "41.38 L" · " 12 345 " 처럼 쉼표·공백·단위가 섞여도 숫자만 골라 읽는다. */
function num(v){
  if(v===null||v===undefined||v==='') return 0;
  if(typeof v==='number') return isFinite(v)?v:0;
  if(typeof v==='boolean') return v?1:0;
  var s = String(v).trim();
  if(!s) return 0;
  var n = Number(s.replace(/[,\s]/g,''));
  if(isFinite(n)) return n;
  n = Number(s.replace(/[^0-9.\-]/g,''));
  return isFinite(n)?n:0;
}
function round1(n){ return Math.round((Number(n)||0)*10)/10; }
function dateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function keyDate(key){ var p=String(key).split('-'); return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); }
function parseDT(s){
  if(!s) return null;
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{1,2}))?/.exec(String(s));
  if(!m) return null;
  var d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), Number(m[4]||0), Number(m[5]||0));
  return isNaN(d.getTime()) ? null : d;
}
function dtInput(d){ return dateKey(d)+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function hm(dt){ var d=parseDT(dt); return d ? pad2(d.getHours())+':'+pad2(d.getMinutes()) : ''; }
function minutesBetween(a,b){ return Math.round((b.getTime()-a.getTime())/60000); }
function toTs(v){
  if(v===undefined||v===null||v==='') return Date.now();
  if(v instanceof Date) return v.getTime();
  var n = Number(v); return isFinite(n)?n:Date.now();
}
function fmtNum(n){
  var v = Math.round(num(n));
  var neg = v < 0; var s = String(Math.abs(v));
  s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'')+s;
}
function fmtWon(n){ return fmtNum(n)+'원'; }
function fmtDec1(n){
  var v = Math.round(num(n)*10)/10;
  var s = Math.abs(v).toFixed(1);
  if(s.slice(-2) === '.0') s = s.slice(0, -2);
  var parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (v<0?'-':'') + parts.join('.');
}
/* 자릿수 지정 소수 표기 (거리 1자리, LPG 2자리 등) */
function fmtDec(v, digits){
  var d = Math.max(0, Math.min(4, Math.round(Number(digits)||0)));
  var n = Math.round(num(v) * Math.pow(10, d)) / Math.pow(10, d);
  var s = Math.abs(n).toFixed(d);
  if(d > 0 && s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  var parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (n<0?'-':'') + parts.join('.');
}
function fmtDec2(v){ return fmtDec(v, 2); }
function fmtMan(v){
  var n = Math.round(num(v));
  if(!n) return '';
  var m = n/10000;
  var s = String(Math.round(m*10)/10);
  return s.replace(/\.0$/,'');
}
function fmtDur(min){
  var m = Math.round(Math.max(0, num(min)));
  var h = Math.floor(m/60), r = m%60;
  if(h<=0 && r===0) return '0분';
  if(h<=0) return r+'분';
  return r>0 ? h+'시간 '+r+'분' : h+'시간';
}
function fmtDurShort(min){
  var m = Math.round(Math.max(0, num(min)));
  var h = Math.floor(m/60), r = m%60;
  if(h>0) return h+'h'+(r>0?pad2(r)+'m':'');
  return r+'m';
}
function fmtClock(ms){
  var s = Math.floor(Math.max(0, Number(ms)||0)/1000);
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  return pad2(h)+':'+pad2(m)+':'+pad2(x);
}
function dateLabelKR(key){
  var d = keyDate(key);
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';
}
function weekdayKR(key){ return WEEKDAYS[keyDate(key).getDay()]; }
function ymLabel(ym){ var p=String(ym).split('-'); return p[0]+'년 '+Number(p[1])+'월'; }
function monthShift(ym, delta){
  var p = String(ym).split('-'); var d = new Date(Number(p[0]), Number(p[1])-1+delta, 1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function esc(s){
  return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;';
  });
}
function setPath(obj, path, val){
  var parts = String(path).split('.');
  var o = obj;
  for(var i=0;i<parts.length-1;i++){
    var k = parts[i], nk = parts[i+1];
    if(o[k]===undefined || o[k]===null || typeof o[k]!=='object'){ o[k] = /^\d+$/.test(nk) ? [] : {}; }
    o = o[k];
  }
  o[parts[parts.length-1]] = val;
  return obj;
}

function blankDay(){
  return {
    runs: [],
    income: {card:'', cash:'', kakaoCash:'', toll:'', direct:'', mode:'auto'},
    distance: {total:'', business:''},
    expenses: [],
    charges: [],
    memo: '',
    photos: [],
    off: false,
    breakMinutes: '',
    gps: {points: []},
    u: 0
  };
}
function normalizeDay(d){
  var b = blankDay();
  if(!d || typeof d!=='object') return b;
  var out = {
    runs: [], income: {}, distance: {}, expenses: [], charges: [],
    memo: typeof d.memo==='string'?d.memo:'',
    photos: Array.isArray(d.photos)?d.photos.filter(function(p){return p && p.data;}):[],
    off: !!d.off,
    breakMinutes: d.breakMinutes===undefined?'':d.breakMinutes,
    gps: {points: Array.isArray(d.gps&&d.gps.points) ? d.gps.points.filter(function(p){return p && isFinite(p.lat) && isFinite(p.lng);}) : []},
    u: num(d.u)

  var a2 = aa * aa, a3 = a2 * aa, a4 = a3 * aa, a5 = a4 * aa, a6 = a5 * aa;
  return {
    x: KATEC_TM.x0 + KATEC_TM.k0 * n * (aa + (1 - t + c) * a3 / 6 + (5 - 18 * t + t * t + 72 * c - 58 * ep2) * a5 / 120),
    y: KATEC_TM.y0 + KATEC_TM.k0 * (m + n * tp * (a2 / 2 + (5 - t + 9 * c + 4 * c * c) * a4 / 24 + (61 - 58 * t + t * t + 600 * c - 330 * ep2) * a6 / 720))
  };
}
function wgs84ToKatec(lat, lng){
  if(lat === '' || lng === '' || lat === null || lng === null || lat === undefined || lng === undefined) return null;
  var la = Number(lat), lo = Number(lng);
  if(!isFinite(la) || !isFinite(lo)) return null;
  if(Math.abs(la) > 90 || Math.abs(lo) > 180) return null;
  if(la === 0 && lo === 0) return null;
  var g = geoToGeocent(la, lo, WGS84_ELL);
  var b = datumToBessel(g);
  var geo = geocentToGeo(b.x, b.y, b.z, KATEC_ELL);
  var xy = katecTmForward(geo.lat, geo.lon);
  if(!isFinite(xy.x) || !isFinite(xy.y)) return null;
  return {x: Math.round(xy.x * 100) / 100, y: Math.round(xy.y * 100) / 100};
}

/* ---------- 계산기·시계 순수 계산 (화면 없이 시험 가능) ---------- */
function calcEval(expr){
  var s = String(expr === null || expr === undefined ? '' : expr)
    .replace(/[×xX]/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/[,\s]/g, '');
  while(/[+*/-]$/.test(s)) s = s.slice(0, -1);
  if(!s) return null;
  var toks = s.match(/\d+(?:\.\d*)?|\.\d+|[+*/-]/g);
  if(!toks || toks.join('') !== s) return null;
  if(toks.length % 2 === 0) return null;
  for(var i = 0; i < toks.length; i++){
    if(i % 2 === 0){ if(!/^(\d|\.)/.test(toks[i])) return null; }
    else if(!/^[+*/-]$/.test(toks[i])) return null;
  }
  var nums = [Number(toks[0])], ops = [];
  for(var j = 1; j < toks.length; j += 2){
    var op = toks[j], v = Number(toks[j + 1]);
    if(op === '*' || op === '/'){
      var prev = nums[nums.length - 1];
      nums[nums.length - 1] = (op === '*') ? prev * v : (v === 0 ? 0 : prev / v);
    } else { ops.push(op); nums.push(v); }
  }
  var r = nums[0];
  for(var n = 0; n < ops.length; n++){
    r = (ops[n] === '-') ? r - nums[n + 1] : r + nums[n + 1];
  }
  return isFinite(r) ? r : null;
}
function clockParts(h24){
  var ampm = (h24 < 12) ? '오전' : '오후';
  var h12 = h24 % 12;
  if(h12 === 0) h12 = 12;
  return {ampm:ampm, h12:h12};
}
function clockPointToHour(dx, dy){
  var ang = Math.atan2(dx, -dy) * 180 / Math.PI;
  if(ang < 0) ang += 360;
  var h = Math.round(ang / 30) % 12;
  return h === 0 ? 12 : h;
}
function clockPointToMinute(dx, dy){
  var ang = Math.atan2(dx, -dy) * 180 / Math.PI;
  if(ang < 0) ang += 360;
  var m = Math.round(ang / 6) % 60;
  return m < 0 ? m + 60 : m;
}
/* 12시간 값을 지금의 오전/오후에 맞춰 24시간으로 바꾼다. */
function clockSetHourPart(hour24, h12){
  var pm = hour24 >= 12;
  var h = h12 % 12;
  if(pm) h += 12;
  return h;
}
function clockParseText(txt){
  var m = /^(\d{1,2})\s*:?\s*(\d{1,2})$/.exec(String(txt || '').trim());
  if(!m) return null;
  var h = Number(m[1]), mi = Number(m[2]);
  if(h > 23 || mi > 59) return null;
  return {hour:h, minute:mi};
}

/* 계산기 상태 */
var calcUI = {open:false, key:'', path:'', label:'', kind:'int', expr:''};
function calcOpenState(){ return calcUI.open; }
function openCalc(el){
  if(!el) return;
  calcUI.open = true;
  calcUI.key = el.getAttribute('data-day') || ui.date;
  calcUI.path = el.getAttribute('data-field') || '';
  calcUI.label = el.getAttribute('data-label') || '금액';
  calcUI.kind = el.getAttribute('data-calc') || 'int';
  calcUI.expr = String(el.value || '').replace(/,/g, '');
  renderCalc();
}
function calcValueNow(){
  if(!calcUI.expr) return '';
  var v = calcEval(calcUI.expr);
  return v === null ? '' : v;
}
function calcDisplayText(){
  var v = calcValueNow();
  if(v === '') return '0';
  if(calcUI.kind === 'dec' || calcUI.kind === 'dec2') return fmtDec(v, calcUI.kind === 'dec' ? 1 : 2);
  return fmtNum(Math.round(v));
}
function renderCalc(){
  var box = document.getElementById('calcModal');
  if(!box) return;
  var keys = ['+','-','×','÷','7','8','9','C','4','5','6','←','1','2','3','.','0','00','='];
  var grid = '';
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    var cls = 'ck';
    if(k === '+' || k === '-' || k === '×' || k === '÷') cls += ' op';
    if(k === 'C' || k === '←') cls += ' del';
    if(k === '=') cls += ' eq';
    if(k === '=') cls += ' wide';
    grid += '<button type="button" class="' + cls + '" data-act="calcKey" data-k="' + esc(k) + '">' + esc(k) + '</button>';
  }
  box.innerHTML = '<div class="sheet-panel calc-panel">'
    + '<div class="calc-head"><span class="calc-title">' + esc(calcUI.label) + '</span>'
    +   '<span class="calc-unit">' + (calcUI.kind === 'dec' ? 'km' : (calcUI.kind === 'dec2' ? 'L' : '원')) + '</span></div>'
    + '<div class="calc-screen"><div class="calc-expr num">' + esc(calcUI.expr || '') + '</div>'
    +   '<div class="calc-now num" id="calcNow">' + calcDisplayText() + '</div></div>'
    + '<div class="calc-grid">' + grid + '</div>'
    + '<div class="calc-foot">'
    +   '<button type="button" class="btn calc-cancel" data-act="calcCancel">취소</button>'
    +   '<button type="button" class="btn btn-primary calc-ok" data-act="calcOk">확인</button>'
    + '</div></div>';
  box.classList.add('show');
  box.setAttribute('aria-hidden', 'false');
  if(document.body && document.body.classList) document.body.classList.add('sheet-open');
}
function renderCalcNow(){
  var now = document.getElementById('calcNow');
  if(now) now.textContent = calcDisplayText();
  var ex = document.querySelector('#calcModal .calc-expr');
  if(ex) ex.textContent = calcUI.expr || '';
}
var CALC_DIGITS = '0123456789.';
var CALC_OPS = '+-×÷*/';
function calcKeyPress(k){
  if(!calcUI.open) return;
  var e = String(calcUI.expr || '');
  if(k === 'C'){ calcUI.expr = ''; renderCalcNow(); return; }
  if(k === '←'){ calcUI.expr = e.slice(0, -1); renderCalcNow(); return; }
  if(k === '='){
    var v = calcEval(e);
    if(v !== null){
      calcUI.expr = String(calcUI.kind === 'int' ? Math.round(v) : Math.round(v * 100) / 100);
      renderCalcNow();
    }
    return;
  }
  if(CALC_OPS.indexOf(k) >= 0){
    var op = (k === '*') ? '×' : (k === '/' ? '÷' : k);
    if(!e){ calcUI.expr = (op === '-' ? '-' : ''); renderCalcNow(); return; }
    if(CALC_OPS.indexOf(e.slice(-1)) >= 0){ calcUI.expr = e.slice(0, -1) + op; }
    else { calcUI.expr = e + op; }
    renderCalcNow();
    return;
  }
  if(k === '.'){
    var tail = e.split(/[+\-×÷]/).pop();
    if(tail.indexOf('.') >= 0) return;
    calcUI.expr = e + (tail === '' ? '0.' : '.');
    renderCalcNow();
    return;
  }
  if(k === '00'){
    if(!e || CALC_OPS.indexOf(e.slice(-1)) >= 0) return;
    calcUI.expr = e + '00';
    renderCalcNow();
    return;
  }
  if(CALC_DIGITS.indexOf(k.charAt(0)) >= 0 || /^[0-9]+$/.test(k)){
    calcUI.expr = e + k;
    renderCalcNow();
  }
}
function calcClose(){
  calcUI.open = false;
  var box = document.getElementById('calcModal');
  if(box){
    box.classList.remove('show');
    box.setAttribute('aria-hidden', 'true');
  }
  if(document.body && document.body.classList) document.body.classList.remove('sheet-open');
}
function calcCancel(){ calcClose(); }
function calcOk(){
  var key = calcUI.key, path = calcUI.path, kind = calcUI.kind;
  var v = calcEval(calcUI.expr);
  var expr = String(calcUI.expr || '');
  calcClose();
  if(!key || !path) return;
  if(v === null || !isFinite(v)){
    if(expr === ''){
      /* 빈 채로 확인하면 값을 지운다. */
      applyDayField(key, path, '');
      refreshCalcField(key, path, '');
      return;
    }
    toast('숫자를 확인해 주세요');
    return;
  }
  var out;
  if(kind === 'dec') out = Math.round(v * 10) / 10;
  else if(kind === 'dec2') out = Math.round(v * 100) / 100;
  else out = Math.round(v);
  if(out < 0) out = 0;
  applyDayField(key, path, out);
  refreshCalcField(key, path, out);
  flashSaved();
}

function clockSyncLive(){
  var p = clockParts(clockUI.hour);
  var hb = document.querySelector('#clockModal .ct-box[data-mode="hour"]');
  var mb = document.querySelector('#clockModal .ct-box[data-mode="minute"]');
  if(hb) hb.textContent = pad2(p.h12);
  if(mb) mb.textContent = pad2(clockUI.minute);
  var isHour = (clockUI.mode === 'hour');
  var ang = isHour ? (p.h12 % 12) * 30 : clockUI.minute * 6;
  var hand = document.querySelector('#clockModal .dial-hand');
  if(hand){
    hand.style.width = (isHour ? 26 : 32) + '%';
    hand.style.transform = 'rotate(' + (ang - 90) + 'deg)';
  }
  var nums = document.querySelectorAll('#clockModal .dial-num');
  for(var i = 0; i < nums.length; i++){
    var v = Number(nums[i].getAttribute('data-v'));
    var on = isHour ? (v === p.h12) : (v === (Math.round(clockUI.minute / 5) * 5) % 60);
    if(nums[i].classList) nums[i].classList[on ? 'add' : 'remove']('on');
  }
}
function clockBindDial(){
  var dial = document.getElementById('clockDial');
  if(!dial || !dial.addEventListener) return;
  function point(ev){
    var r = dial.getBoundingClientRect ? dial.getBoundingClientRect() : {left:0, top:0, width:1, height:1};
    var cx = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
    var cy = (ev.touches && ev.touches[0]) ? ev.touches[0].clientY : ev.clientY;
    return {dx: cx - (r.left + r.width / 2), dy: cy - (r.top + r.height / 2)};
  }
  var dragging = false, moved = false, sx = 0, sy = 0;
  function down(ev){
    var p = point(ev);
    dragging = true; moved = false; sx = p.dx; sy = p.dy;
  }
  function move(ev){
    if(!dragging) return;
    var p = point(ev);
    if(!moved){
      var dx = p.dx - sx, dy = p.dy - sy;
      if((dx * dx + dy * dy) < 100) return;   /* 10px 넘게 움직여야 끌기로 본다 */
      moved = true;
    }
    if(clockUI.mode === 'hour') clockUI.hour = clockSetHourPart(clockUI.hour, clockPointToHour(p.dx, p.dy));
    else clockUI.minute = clockPointToMinute(p.dx, p.dy);
    clockSyncLive();
  }
  function up(){ dragging = false; moved = false; }
  dial.addEventListener('touchstart', function(ev){ down(ev); }, {passive:true});
  dial.addEventListener('touchmove', function(ev){ move(ev); if(moved && ev.preventDefault) ev.preventDefault(); }, {passive:false});
  dial.addEventListener('touchend', up);
  dial.addEventListener('touchcancel', up);
  dial.addEventListener('mousedown', down);
  dial.addEventListener('mousemove', move);
  dial.addEventListener('mouseup', up);
  dial.addEventListener('mouseleave', up);
}
function clockTap(kind, val){
  if(!clockUI.open) return;
  if(kind === 'hour'){
    var h = Number(val);
    clockUI.hour = clockSetHourPart(clockUI.hour, h % 12 === 0 ? 12 : h);
    clockUI.mode = 'minute';
    renderClock();
    return;
  }
  if(kind === 'minute'){
    clockUI.minute = Math.max(0, Math.min(59, Number(val) || 0));
    renderClock();
    return;
  }
  if(kind === 'ampm'){
    var pmNow = clockUI.hour >= 12;
    var wantPm = (val === 'pm');
    if(pmNow !== wantPm) clockUI.hour = (clockUI.hour + 12) % 24;
    renderClock();
    return;
  }
  if(kind === 'mode'){
    clockUI.mode = (val === 'minute') ? 'minute' : 'hour';
    renderClock();
    return;
  }
  if(kind === 'nudge'){
    var d = Number(val) || 0;
    clockUI.minute = clockUI.minute + d;
    if(clockUI.minute > 59) clockUI.minute = 59;
    if(clockUI.minute < 0) clockUI.minute = 0;
    renderClock();
    return;
  }
  if(kind === 'kb'){
    if(clockUI.kb){
      clockUI.kb = false;
    } else {
      clockUI.kb = true;
      clockUI.text = pad2(clockUI.hour) + ':' + pad2(clockUI.minute);
    }
    renderClock();
    var inp = document.getElementById('clockKbInput');
    if(inp && inp.focus) try{ inp.focus(); }catch(e){}
    return;
  }
}

function courseSpanText(pts){
  if(!pts || !pts.length) return 'GPS 기록이 없습니다. 홈에서 START를 누르면 이동 경로가 쌓입니다.';
  var a = new Date(pts[0].t), b = new Date(pts[pts.length-1].t);
  return '시작 ' + pad2(a.getHours()) + ':' + pad2(a.getMinutes()) + ' · 마지막 ' + pad2(b.getHours()) + ':' + pad2(b.getMinutes()) + ' · ' + pts.length + '지점';
}

function calCellHtml(c, today, view){
  if(!c) return '<div class="cell empty"></div>';
  var d = state.days[c.key];
  var inc = incomeOf(d);
  var mins = d ? dayWorkMinutes(d, Date.now()) : 0;
  var outTotal = d ? (expenseTotal(d) + chargeTotals(d).amount) : 0;
  var cashAll = inc.cash + inc.kakaoCash;
  var off = !!(d && d.off);
  var pat = isPatternOff(c.key, state.settings.offWeekdays);
  var cls = 'cell' + (c.dow === 0 ? ' sun' : '') + (c.dow === 6 ? ' sat' : '')
    + (off ? ' off' : '') + (!off && pat ? ' pat' : '') + (c.key === today ? ' today' : '');
  var tip = c.key + ' · ' + (off ? '휴무' : fmtDur(mins)) + ' · ' + fmtWon(inc.sales)
    + (outTotal > 0 ? ' · 지출 ' + fmtWon(outTotal) : '');
  var html = '<div class="' + cls + '" data-act="openDay" data-key="' + c.key + '" title="' + esc(tip) + '">';
  html += '<div class="d">' + c.d + '</div>';
  if(view === 'time'){
    if(mins > 0) html += '<div class="t-hours num">' + fmtDurShort(mins) + '</div>';
    if(inc.sales > 0) html += '<div class="ln sales">' + fmtNum(inc.sales) + '</div>';
  } else {
    if(inc.sales > 0) html += '<div class="ln sales">' + fmtNum(inc.sales) + '</div>';
    if(inc.card > 0) html += '<div class="ln kcard">' + fmtNum(inc.card) + '</div>';
    if(cashAll > 0) html += '<div class="ln cash">' + fmtNum(cashAll) + '</div>';
  }
  if(outTotal > 0) html += '<div class="ln out">' + fmtNum(outTotal) + '</div>';
  html += '</div>';
  return html;
}

function dataYears(){
  var set = {};
  Object.keys(state.days).forEach(function(k){ set[k.slice(0,4)] = 1; });
  set[String(new Date().getFullYear())] = 1;
  set[String(ui.year)] = 1;
  return Object.keys(set).sort().reverse();
}

function storageSizeMb(){

function fmtShortTime(ts){
  var d = new Date(ts);
  return pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());

/* ---------- 시작 / 종료 ---------- */
function doStart(){ return startRunAt(new Date()); }
/* START를 누른 날짜(영업일)에 운행을 붙인다. 야간 운행은 이 날짜가 기준이다. */
function startRunAt(now){
  if(state.session){ toast('이미 운행 중입니다.'); return false; }
  var key = dateKey(now);
  var d = touchDay(key);
  if(d.off) d.off = false;
  d.runs.push({s: dtInput(now), e: ''});
  state.session = {start: dtInput(now), dayKey: key};
  saveNow();
  startGeo();
  ui.courseKey = '';
  ui.date = key;
  ui.screen = 'home';
  render();
  toast('운행 시작 · ' + hm(dtInput(now)));
  return true;
}
function doStop(){ return stopRunAt(new Date()); }
/* STOP은 언제 눌러도 START를 누른 날짜의 운행으로 끝낸다.
   화요일 21:00 START → 수요일 07:00 STOP 이면 화요일 기록 한 칸에 10시간. */
function stopRunAt(now){
  if(!state.session){ toast('운행 중이 아닙니다.'); return false; }
  var startAt = parseDT(state.session.start);
  var elapsedMin = startAt ? minutesBetween(startAt, now) : 0;
  if(elapsedMin > 20*60){
    if(!confirm('START를 누른 지 ' + Math.round(elapsedMin/60) + '시간 지났습니다.\n지금 종료하면 이 운행은 최대 24시간으로 계산됩니다.\n\n지금 종료할까요? (취소하면 입력 화면에서 시각을 직접 고칠 수 있습니다)')){
      ui.date = state.session.dayKey || dateKey(now);
      ui.screen = 'input';
      render();
      return false;
    }
  }
  var key = state.session.dayKey || dateKey(now);
  var d = touchDay(key);
  var run = null;
  for(var i=d.runs.length-1;i>=0;i--){ if(d.runs[i].s && !d.runs[i].e){ run = d.runs[i]; break; } }
  if(!run){ d.runs.push({s: state.session.start, e: ''}); run = d.runs[d.runs.length-1]; }
  var rs = parseDT(run.s);
  var endDate = new Date(now.getTime());
  if(!rs || endDate.getTime() - rs.getTime() < 60000){
    endDate = new Date((rs ? rs.getTime() : now.getTime()) + 60000);
  }
  run.e = dtInput(endDate);
  d.u = Date.now();
  state.session = null;
  stopGeo();
  saveNow();
  /* STOP을 누르면 방금 끝낸 운행일(START를 누른 날)의 자료입력으로 바로 넘어간다. */
  ui.courseKey = '';
  ui.date = key;
  ui.screen = 'input';
  render();
  try{ window.scrollTo(0,0); }catch(e){}
  toast('운행 종료 · ' + fmtDur(dayWorkMinutes(d, Date.now())) + ' · 자료입력으로 이동');
}

/* ---------- GPS ---------- */
function startGeo(){
  if(!('geolocation' in navigator)){ gpsState.status = 'unsupported'; return; }
  if(gpsState.watch !== null) return;
  gpsState.status = 'wait';
  try{
    gpsState.watch = navigator.geolocation.watchPosition(onGeo, onGeoErr, {enableHighAccuracy:true, maximumAge:15000, timeout:30000});
  }catch(e){ gpsState.status = 'error'; }
}
function stopGeo(){
  if(gpsState.watch !== null && navigator.geolocation){
    try{ navigator.geolocation.clearWatch(gpsState.watch); }catch(e){}
  }
  gpsState.watch = null;
}
function onGeo(pos){
  gpsState.status = 'on';
  gpsState.lastAt = Date.now();
  if(!state.session) return;
  var key = state.session.dayKey || todayKey();
  var d = state.days[key];
  if(!d) return;
  if(!d.gps) d.gps = {points: []};
  var pts = d.gps.points;
  var p = {lat: +Number(pos.coords.latitude).toFixed(6), lng: +Number(pos.coords.longitude).toFixed(6), t: Date.now(), acc: Math.round(pos.coords.accuracy || 0)};
  var prev = pts.length ? pts[pts.length-1] : null;
  if(shouldRecordPoint(prev, p)){
    pts.push(p);
    if(pts.length > 3000) pts.splice(0, pts.length - 3000);
    d.u = Date.now();
    saveSoon();
    if(ui.screen === 'input' && ui.date === key) refreshCourse();
    if(ui.screen === 'home') refreshHomeCourse();
  }
  updateGpsLine();
}
function onGeoErr(err){
  gpsState.status = (err && err.code === 1) ? 'denied' : 'error';
  updateGpsLine();
}
function updateGpsLine(){
  var el = document.getElementById('gpsLine');
  if(!el) return;
  var txt;
  if(!('geolocation' in navigator)) txt = '이 브라우저는 위치 기능을 지원하지 않습니다 (운행 기록은 정상 저장)';
  else if(gpsState.status === 'denied') txt = '위치 권한이 꺼져 있어 코스가 기록되지 않습니다 (운행 기록은 정상 저장)';
  else if(gpsState.status === 'error') txt = '위치를 받지 못했습니다 · 실내에서는 정확도가 떨어질 수 있어요';
  else if(state.session){
    var pts = (state.days[state.session.dayKey || todayKey()] || {}).gps;
    var n = pts && pts.points ? pts.points.length : 0;
    txt = gpsState.status === 'on' ? ('GPS ' + n + '지점 기록 중') : 'GPS 위치 확인 중…';
  } else {
    var td = state.days[todayKey()];
    var n2 = td && td.gps && td.gps.points ? td.gps.points.length : 0;
    txt = n2 ? ('오늘 GPS ' + n2 + '지점 기록됨') : 'START를 누르면 위치 기록이 시작됩니다';
  }
  el.textContent = txt;
}
function refreshCourse(){
  var pts = coursePoints();
  setText('courseCount', 'GPS ' + pts.length + '지점');
  setText('courseSpan', courseSpanText(pts));
  var link = document.getElementById('courseLink');
  if(link) link.setAttribute('href', buildMapsDirUrl(pts) || '#');
  updateMap('inputMap', pts);
}

}

var gmPromise = null, gmFailed = false;
window.gm_authFailure = function(){
  gmFailed = true;
  gmPromise = null;
  var msgs = document.querySelectorAll('.map-msg');
  for(var i=0;i<msgs.length;i++){
    msgs[i].style.display = '';
    msgs[i].classList.add('err');
    msgs[i].innerHTML = '지도를 표시하지 못했습니다.<br>API 키의 사용 제한·결제 설정을 확인해 주세요.<br>아래 버튼으로 구글 지도에서 코스를 열 수 있습니다.';
  }
};
function loadGmaps(key){
  if(window.google && window.google.maps && window.google.maps.Map) return Promise.resolve();
  if(gmFailed) return Promise.reject(new Error('auth'));
  if(gmPromise) return gmPromise;
  gmPromise = new Promise(function(resolve, reject){
    var cb = '__gmaps' + Math.floor(Math.random()*1e9);
    window[cb] = function(){ try{ delete window[cb]; }catch(e){} resolve(); };
    var s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&language=ko&region=KR&callback=' + cb;
    s.async = true; s.defer = true;
    s.onerror = function(){ gmPromise = null; reject(new Error('network')); };
    document.head.appendChild(s);
    setTimeout(function(){
      if(!(window.google && window.google.maps && window.google.maps.Map)){ gmPromise = null; reject(new Error('timeout')); }
    }, 12000);
  });
  return gmPromise;
}
function mapBoxHtml(id, pts){
  var key = (state.settings.gmapsKey || '').trim();
  var list = (pts || []).filter(function(p){ return p && isFinite(p.lat) && isFinite(p.lng); });
  if(!list.length) return '<div class="map-hint">GPS 기록이 아직 없습니다. START를 누르고 위치를 허용해 주세요.</div>';
  /* 키가 없으면 GPS 점만으로 그리는 지도(SVG)로 같은 빨간 경로를 보여 준다. */
  if(!key) return '<div class="map-wrap"><div class="map-box map-svg-box" id="' + id + 'Svg">' + routeSvg(list, {uid:id}) + '</div></div>';
  return '<div class="map-wrap"><div class="map-box" id="' + id + '"></div><div class="map-msg" id="' + id + 'Msg">지도를 불러오는 중…</div></div>';
}
function mountMap(id, pts){
  var box = document.getElementById(id);
  if(!box) return;
  var msg = document.getElementById(id + 'Msg');
  var key = (state.settings.gmapsKey || '').trim();
  if(!key || !pts || !pts.length) return;
  if(!navigator.onLine){
    if(msg){ msg.style.display = ''; msg.classList.add('err'); msg.textContent = '오프라인입니다. 아래 버튼으로 구글 지도에서 코스를 열 수 있어요.'; }
    return;
  }
  loadGmaps(key).then(function(){
    if(gmFailed) throw new Error('auth');
    drawRoute(id, pts);
  }).catch(function(err){
    if(!msg) return;
    msg.style.display = '';
    msg.classList.add('err');
    msg.innerHTML = (err && err.message === 'auth')
      ? '지도를 표시하지 못했습니다.<br>API 키의 사용 제한(HTTP 리퍼러)·결제 설정을 확인해 주세요.<br>아래 버튼으로 코스를 열 수 있습니다.'
