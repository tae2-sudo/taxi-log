<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>taxi-log · 개인택시 운행관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305140F'/%3E%3Ctext x='32' y='45' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%ED%83%9D%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0B1120;--bg-deep:#05080F;--surface:#131C31;--surface2:#1A2539;--surface3:#0F172A;
  --line:#243049;--line-soft:#1B2540;
  --text:#E8EDF5;--muted:#8391A7;--dim:#5D6B84;
  --emerald:#10B981;--emerald-2:#34D399;--emerald-ink:#05261A;
  --amber:#F59E0B;--amber-2:#F5B342;--amber-ink:#2B1A00;
  --sky:#60A5FA;--rose:#F87171;
  --r:20px;--r-sm:14px;--shadow:0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#05080F}
body{
  margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 460px at 50% -14%,#17243d 0%,#0B1120 46%,#070B15 100%) no-repeat,#070B15;
  background-attachment:fixed;
  color:var(--text);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit}
a{color:var(--emerald-2);text-decoration:none}
h1,h2,h3,p{margin:0}
::selection{background:rgba(16,185,129,.28)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-variant-numeric:tabular-nums}

/* ---------- 상단 바 ---------- */
.app-header{position:sticky;top:0;z-index:30;background:rgba(11,17,32,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line-soft);
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(140deg,#1E3A5F,#131C31);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--emerald-2)}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand .sub{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate-chip{font-size:11px;font-weight:700;color:var(--text);background:var(--surface2);border:1px solid var(--line);
  padding:6px 10px;border-radius:999px;white-space:nowrap;flex:0 0 auto;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.plate-chip svg{width:13px;height:13px;color:var(--muted)}

/* ---------- 레이아웃 ---------- */
main{padding:6px 16px calc(104px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.screen-title{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:10px 2px 14px}
.screen-title h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
.screen-title .date-line{font-size:13px;font-weight:600;color:var(--muted)}
.screen-title .date-line span{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.spacer{flex:1}

/* ---------- 카드 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.tight{padding:13px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.card-t{font-size:14px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.card-t::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--emerald);display:inline-block}
.card-sub{font-size:12px;color:var(--muted);font-weight:600}
.section-h{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
.section-h h2{font-size:15px;font-weight:800;letter-spacing:-.02em}
.section-h a,.section-h .sec-meta{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:2px}
.section-h svg{width:14px;height:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{flex-wrap:wrap}

/* ---------- 버튼 ---------- */
.btn{min-height:44px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;cursor:pointer;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,#34D399,#10B981);border-color:transparent;color:var(--emerald-ink);font-weight:800}
.btn-green{background:linear-gradient(135deg,#34D399,#10B981);border-color:transparent;color:var(--emerald-ink)}
.btn-red{background:linear-gradient(135deg,#FBBF24,#F59E0B);border-color:transparent;color:var(--amber-ink);font-weight:800}
.btn-soft{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.22);color:var(--emerald-2)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--emerald-2)}
.btn-danger-ghost{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.22);color:var(--rose)}
.btn-sm{min-height:34px;font-size:12.5px;padding:0 11px;border-radius:10px}
.btn-block{width:100%}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;cursor:default;transform:none}
.btn svg{width:16px;height:16px}

/* ---------- 홈 ---------- */
.home-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 2px 18px}
.home-head .date{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.home-head .hello{font-size:23px;font-weight:800;letter-spacing:-.035em;margin-top:3px;line-height:1.2}
.home-head .hello em{font-style:normal;color:var(--emerald-2)}
.veh-badge{width:46px;height:46px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;color:#9FB0C7;flex:0 0 auto;position:relative}
.veh-badge svg{width:22px;height:22px}
.veh-badge .live-dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--amber);
  border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(245,158,11,.18)}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.summary .card{margin-bottom:0;padding:15px 16px}
.summary .card.hero{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
  background:linear-gradient(135deg,#182642 0%,#131C31 62%);border-color:#26334d;border-radius:22px;padding:18px}
.label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.label svg{width:14px;height:14px}
.value{font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.03em;white-space:nowrap}
.card.hero .value{font-size:32px;letter-spacing:-.045em;color:#F4F8FF}
.unit{font-size:13.5px;color:var(--muted);font-weight:600;margin-left:2px;letter-spacing:0}
.card.hero .unit{font-size:15px;color:#9FB0C7;margin-left:4px}
.card.hero .sub{margin-top:6px;font-size:12px;color:#93A2B9}
.sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.amber{color:var(--amber-2)}
.emerald{color:var(--emerald-2)}
.chip{font-size:11.5px;font-weight:700;color:var(--emerald-2);background:rgba(52,211,153,.1);
  border:1px solid rgba(52,211,153,.16);padding:5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.off{color:var(--amber-2);background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.18)}
.chip.red{color:var(--rose);background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.18)}

.drive{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;margin-bottom:14px}
.elapsed-label{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.running .dot{background:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.16);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(245,158,11,0)}}
.elapsed{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1.12;margin-top:2px;font-variant-numeric:tabular-nums}
.running .elapsed{color:var(--amber-2)}
.btn-wrap{position:relative;margin:20px 0 22px;display:grid;place-items:center}
.ring{position:absolute;width:232px;height:232px;border-radius:50%;border:1px solid rgba(52,211,153,.16);pointer-events:none}
.running .ring{border-color:rgba(245,158,11,.22);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.055);opacity:.55}}
.toggle{width:190px;height:190px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#5CEBB8,#10B981 72%);color:var(--emerald-ink);
  box-shadow:0 18px 46px rgba(16,185,129,.32),inset 0 -6px 16px rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-family:inherit;transition:transform .12s ease,background .3s;touch-action:manipulation}
.toggle:active{transform:scale(.96)}
.toggle:focus-visible{outline:3px solid #fff;outline-offset:6px}
.toggle svg{width:32px;height:32px}
.toggle .t{font-size:30px;font-weight:800;letter-spacing:.05em}
.toggle .s{font-size:11.5px;font-weight:700;opacity:.7}
.running .toggle{background:radial-gradient(circle at 35% 30%,#FFD27A,#F59E0B 72%);color:var(--amber-ink);
  box-shadow:0 18px 46px rgba(245,158,11,.3),inset 0 -6px 16px rgba(0,0,0,.16)}
.times{display:grid;grid-template-columns:1fr 1px 1fr;width:100%;max-width:340px;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:12px 0}
.times .div{background:var(--line)}
.times .t{text-align:center}
.times .k{font-size:11.5px;color:var(--muted);font-weight:600}
.times .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.times .v.empty{color:#3F4C64}
.run-sub{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px;min-height:18px}

/* ---------- 지도 ---------- */
.map{padding:0;overflow:hidden}
.map-view{position:relative}
.map-box{height:170px;width:100%}
.map-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;
  font-size:12px;color:var(--muted);background:linear-gradient(160deg,#101a2e,#131C31);line-height:1.55}
.map-msg.hide{display:none}
.map-msg.err{background:rgba(245,158,11,.07);color:#E9B66A}
.map-hint{background:linear-gradient(160deg,#101a2e,#131C31);border:1px dashed var(--line);border-radius:14px;padding:16px;
  font-size:12px;color:var(--muted);line-height:1.6}
.map-wrap{position:relative;border-radius:0;overflow:hidden;background:#0F172A}
.map-stats{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 16px 4px;gap:6px}
.map-stats .k{font-size:11px;color:var(--muted);font-weight:600}
.map-stats .v{font-size:16px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.map-stats .v.hi{color:var(--emerald-2)}
.map-foot{padding:10px 14px 14px}
.gpin{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.gpin i{transform:rotate(-45deg);font-style:normal;font-size:11px;font-weight:800;color:#fff;font-family:-apple-system,sans-serif}

/* ---------- 월간 요약 ---------- */
.sum-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.sum-card .sum-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.sum-card .big{font-size:27px;font-weight:800;letter-spacing:-.04em;margin:5px 0 12px;font-variant-numeric:tabular-nums}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-item{background:var(--surface3);border:1px solid var(--line-soft);border-radius:12px;padding:9px 10px}
.sum-item .k{font-size:10.5px;color:var(--muted);font-weight:600}
.sum-item .v{font-size:13.5px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sum-hi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.sum-hi .k{font-size:11px;color:var(--muted);font-weight:600}
.sum-hi .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.sum-foot{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
.sum-foot b{color:var(--text);font-variant-numeric:tabular-nums}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--surface3);border:1px solid var(--line-soft);border-radius:13px;padding:10px 8px;text-align:center}
.kpi .v{font-size:14.5px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kpi .v.money{font-size:12.5px;letter-spacing:-.04em;white-space:nowrap}
.kpi .v.time{font-size:12.5px;letter-spacing:-.03em;white-space:nowrap}
.kpi .v.hi{color:var(--emerald-2)}
.kpi .v.amber{color:var(--amber-2)}
.kpi .v.sky{color:var(--sky)}
.kpi .l{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}

/* ---------- 폼 ---------- */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:11.5px;color:var(--muted);font-weight:600}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--surface3);
  border:1px solid var(--line);border-radius:11px;padding:9px 10px;min-height:42px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:#4E5C74}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(52,211,153,.4);outline-offset:0;border-color:rgba(52,211,153,.55)}
input.num,select.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=datetime-local],input[type=month],input[type=date]{font-size:13.5px;padding:8px 8px;color-scheme:dark}
.field .unit{position:relative}
.field .unit input{padding-right:34px}
.field .unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);font-weight:700}

.seg{display:flex;background:var(--surface3);border:1px solid var(--line-soft);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:32px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface2);color:var(--emerald-2);box-shadow:0 1px 3px rgba(0,0,0,.35)}

.hint-box{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.18);border-radius:13px;padding:11px 12px;font-size:12px;color:#B9C7DA;line-height:1.6}
.hint-box b{color:#DCE6F5}
.warn-box{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.24);border-radius:13px;padding:11px 12px;font-size:12px;color:#EFC077;line-height:1.6}
.warn-box b{color:#FFD79A}
.ok-box{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.24);border-radius:13px;padding:11px 12px;font-size:12px;color:#8FE5C2;line-height:1.6}

.run-row{border:1px solid var(--line-soft);border-radius:13px;padding:11px;margin-bottom:8px;background:var(--surface3)}
.run-row .rr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.run-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line-soft);border-radius:13px;padding:11px;margin-bottom:8px;background:var(--surface3);position:relative}
.list-row .full{grid-column:1 / -1}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.list-head b{font-size:12px;color:var(--muted);font-weight:700}
.del-x{border:0;background:rgba(255,255,255,.05);color:var(--muted);width:28px;height:28px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;line-height:1}
.del-x:active{background:rgba(255,255,255,.1)}
.station-pick{display:flex;flex-direction:column;gap:6px}
.station-pick select{font-size:13.5px;font-weight:700}
.st-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line-soft);border-radius:11px;padding:9px 10px;margin-bottom:6px;background:var(--surface3)}
.st-row .st-name{font-size:13px;font-weight:700;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row .st-unit{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--emerald-2);font-variant-numeric:tabular-nums;flex:none}

.total-line{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface3);border:1px solid var(--line-soft);border-radius:11px;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.total-line b{font-size:14.5px;color:var(--text);font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);font-weight:600;margin-top:9px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}

.off-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;padding:13px;border:1px dashed var(--line);background:var(--surface3)}
.off-toggle.on{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.28)}
.off-toggle .t{font-size:13.5px;font-weight:800}
.off-toggle .s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- 달력 ---------- */
.cal-wrap{margin-top:2px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.cal-dow div{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal-dow div:first-child{color:#F08A8A}
.cal-dow div:last-child{color:var(--sky)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{min-height:74px;border-radius:10px;background:var(--surface3);border:1px solid var(--line-soft);padding:4px 2px 3px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;overflow:hidden}
.cell.empty{background:transparent;border-color:transparent;cursor:default}
.cell .d{font-size:11px;font-weight:700;color:#A9B6C9;line-height:1.1}
.cell.sun .d{color:#F08A8A}

.cell .amt.sales{color:var(--emerald-2);font-weight:800}
.cell .amt.kcard{color:var(--sky);font-weight:700}
.cell .amt.kcash{color:#A9B6C9;font-weight:700}

.cell .offtag{font-size:8px;font-weight:800;color:var(--amber-2);background:rgba(245,158,11,.16);border-radius:4px;padding:0 3px;line-height:12px}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}

.photo img{width:100%;height:100%;object-fit:cover;display:block}

.photo-btn{display:inline-flex;align-items:center;gap:6px}
.search-result{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.search-result:last-child{border-bottom:0}
.search-result .dt{font-size:11.5px;font-weight:700;color:var(--emerald-2);white-space:nowrap}

.settings-block{border-top:1px solid var(--line-soft);margin-top:14px;padding-top:14px}

.settings-block h3{font-size:13.5px;font-weight:800;color:var(--text);margin-bottom:9px;letter-spacing:-.01em}
.week-btns{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-btns button{min-height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface3);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.week-btns button.on{background:linear-gradient(135deg,#34D399,#10B981);border-color:transparent;color:var(--emerald-ink);font-weight:800}
.week-btns button.sun.on{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:var(--amber-ink)}
.week-btns button.sat.on{background:linear-gradient(135deg,#60A5FA,#3B82F6);color:#04121F}
.stor-meter{height:8px;border-radius:99px;background:var(--surface3);border:1px solid var(--line-soft);overflow:hidden;margin:8px 0 4px}
.stor-meter i{display:block;height:100%;background:linear-gradient(90deg,#34D399,#10B981);width:0}

/* ---------- 하단 탭 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,17,32,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:#5D6B84;font-weight:700;min-height:52px;cursor:pointer;justify-content:center}

.tab.active{color:var(--text)}

  display:grid;place-items:center;color:var(--amber-2);margin-top:-16px;box-shadow:0 8px 18px rgba(0,0,0,.4)}

.tab.plus.active .ico{border-color:rgba(52,211,153,.45);color:var(--emerald-2);background:rgba(52,211,153,.1)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);
  background:rgba(26,37,57,.97);border:1px solid var(--line);color:var(--text);font-size:12.5px;font-weight:600;
  padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;

.modal{position:fixed;inset:0;background:rgba(4,7,13,.94);display:none;align-items:center;justify-content:center;z-index:70;padding:18px}

<script>
"use strict";
/* ===== CORE START ===== */
var WEEKDAYS = ['일','월','화','수','목','금','토'];

function pad2(n){ n = Number(n)||0; return (n<10?'0':'')+n; }
function num(v){
  if(v===null||v===undefined||v==='') return 0;
  if(typeof v==='number') return isFinite(v)?v:0;
  var n = Number(String(v).replace(/[,\s]/g,''));
  return isFinite(n)?n:0;
}
function round1(n){ return Math.round((Number(n)||0)*10)/10; }
function dateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function keyDate(key){ var p=String(key).split('-'); return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); }
function parseDT(s){
  if(!s) return null;
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{1,2}))?/.exec(String(s));
  if(!m) return null;
  var d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), Number(m[4]||0), Number(m[5]||0));
  return isNaN(d.getTime()) ? null : d;
}
function dtInput(d){ return dateKey(d)+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function hm(dt){ var d=parseDT(dt); return d ? pad2(d.getHours())+':'+pad2(d.getMinutes()) : ''; }
function minutesBetween(a,b){ return Math.round((b.getTime()-a.getTime())/60000); }
function toTs(v){
  if(v===undefined||v===null||v==='') return Date.now();
  if(v instanceof Date) return v.getTime();
  var n = Number(v); return isFinite(n)?n:Date.now();
}
function fmtNum(n){
  var v = Math.round(num(n));
  var neg = v < 0; var s = String(Math.abs(v));
  s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'')+s;
}
function fmtWon(n){ return fmtNum(n)+'원'; }
function fmtDec1(n){
  var v = Math.round(num(n)*10)/10;
  var s = Math.abs(v).toFixed(1);
  if(s.slice(-2) === '.0') s = s.slice(0, -2);
  var parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (v<0?'-':'') + parts.join('.');
}
function fmtMan(v){
  var n = Math.round(num(v));
  if(!n) return '';
  var m = n/10000;
  var s = String(Math.round(m*10)/10);
  return s.replace(/\.0$/,'');
}
function fmtDur(min){
  var m = Math.round(Math.max(0, num(min)));
  var h = Math.floor(m/60), r = m%60;
  if(h<=0 && r===0) return '0분';
  if(h<=0) return r+'분';
  return r>0 ? h+'시간 '+r+'분' : h+'시간';
}
function fmtDurShort(min){
  var m = Math.round(Math.max(0, num(min)));
  var h = Math.floor(m/60), r = m%60;
  if(h>0) return h+'h'+(r>0?pad2(r)+'m':'');
  return r+'m';
}
function fmtClock(ms){
  var s = Math.floor(Math.max(0, Number(ms)||0)/1000);
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  return pad2(h)+':'+pad2(m)+':'+pad2(x);
}
function dateLabelKR(key){
  var d = keyDate(key);
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';
}
function weekdayKR(key){ return WEEKDAYS[keyDate(key).getDay()]; }
function ymLabel(ym){ var p=String(ym).split('-'); return p[0]+'년 '+Number(p[1])+'월'; }
function monthShift(ym, delta){
  var p = String(ym).split('-'); var d = new Date(Number(p[0]), Number(p[1])-1+delta, 1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function esc(s){
  return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;';
  });
}
function setPath(obj, path, val){
  var parts = String(path).split('.');
  var o = obj;
  for(var i=0;i<parts.length-1;i++){
    var k = parts[i], nk = parts[i+1];
    if(o[k]===undefined || o[k]===null || typeof o[k]!=='object'){ o[k] = /^\d+$/.test(nk) ? [] : {}; }
    o = o[k];
  }
  o[parts[parts.length-1]] = val;
  return obj;
}

function blankDay(){
  return {
    runs: [],
    income: {card:'', cash:'', toll:'', direct:'', mode:'auto'},
    distance: {total:'', business:''},
    expenses: [],
    charges: [],
    memo: '',
    photos: [],
    off: false,
    breakMinutes: '',
    gps: {points: []},
    u: 0
  };
}
function normalizeDay(d){
  var b = blankDay();
  if(!d || typeof d!=='object') return b;
  var out = {
    runs: [], income: {}, distance: {}, expenses: [], charges: [],
    memo: typeof d.memo==='string'?d.memo:'',
    photos: Array.isArray(d.photos)?d.photos.filter(function(p){return p && p.data;}):[],
    off: !!d.off,
    breakMinutes: d.breakMinutes===undefined?'':d.breakMinutes,
    gps: {points: Array.isArray(d.gps&&d.gps.points) ? d.gps.points.filter(function(p){return p && isFinite(p.lat) && isFinite(p.lng);}) : []},
    u: num(d.u)
  };
  if(Array.isArray(d.runs)){
    out.runs = d.runs.filter(function(r){return r && typeof r==='object';}).map(function(r){
      return {s: r.s||'', e: r.e||''};
    });
  }
  var inc = d.income||{};
  out.income = {
    card: inc.card===undefined?'':inc.card,
    cash: inc.cash===undefined?'':inc.cash,
    toll: inc.toll===undefined?'':inc.toll,
    direct: inc.direct===undefined?'':inc.direct,
    mode: inc.mode==='direct'?'direct':'auto'
  };
  var ds = d.distance||{};
  out.distance = {total: ds.total===undefined?'':ds.total, business: ds.business===undefined?'':ds.business};
  if(Array.isArray(d.expenses)){
    out.expenses = d.expenses.filter(function(e){return e && typeof e==='object';}).map(function(e, i){
      return {id: e.id||('e'+i), cat: e.cat||'기타', pay: e.pay||'카드', amount: e.amount===undefined?'':e.amount, memo: e.memo||''};
    });
  }
  if(Array.isArray(d.charges)){
    out.charges = d.charges.filter(function(c){return c && typeof c==='object';}).map(function(c, i){
      return {id: c.id||('c'+i), station: c.station||'', fuel: c.fuel||'LPG', liters: c.liters===undefined?'':c.liters, unit: c.unit===undefined?'':c.unit, amount: c.amount===undefined?'':c.amount};
    });
  }
  return out;
}

function runsOf(day){ return (day && Array.isArray(day.runs)) ? day.runs : []; }
function runMinutes(run, nowTs){
  if(!run || !run.s) return 0;
  var s = parseDT(run.s); if(!s) return 0;
  var e = run.e ? parseDT(run.e) : new Date(toTs(nowTs));
  if(!e) return 0;
  var m = minutesBetween(s, e);
  if(!(m>0)) return 0;
  if(!run.e && m > 24*60) return 0;
  return Math.min(m, 24*60);
}
function dayRawMinutes(day, nowTs){
  var t=0; runsOf(day).forEach(function(r){ t += runMinutes(r, nowTs); }); return t;
}
function dayWorkMinutes(day, nowTs){
  var br = Math.max(0, Math.round(num(day && day.breakMinutes)));
  return Math.max(0, dayRawMinutes(day, nowTs) - br);
}
function daySpan(day){
  var first=null, last=null;
  runsOf(day).forEach(function(r){
    var s = parseDT(r.s), e = parseDT(r.e);
    if(s && (!first || s<first)) first=s;
    if(e && (!last || e>last)) last=e;
  });
  return {start:first, end:last};
}
function incomeOf(day){
  var inc = (day && day.income) || {};
  var card = num(inc.card), cash = num(inc.cash), toll = num(inc.toll);
  var auto = card + cash;
  var directOn = inc.mode === 'direct' && inc.direct !== '' && inc.direct !== null && inc.direct !== undefined;
  var sales = directOn ? num(inc.direct) : auto;
  return {card:card, cash:cash, toll:toll, sales:sales, auto:auto, direct:!!directOn};
}
function expenseTotal(day){
  var s=0; ((day&&day.expenses)||[]).forEach(function(e){ s += num(e.amount); }); return Math.round(s);
}
function chargeAmount(c){
  if(!c) return 0;
  if(c.amount!=='' && c.amount!==null && c.amount!==undefined && isFinite(Number(c.amount))) return Math.round(num(c.amount));
  return Math.round(num(c.liters)*num(c.unit));
}
function chargeTotals(day){
  var L=0, A=0;
  ((day&&day.charges)||[]).forEach(function(c){ L += num(c.liters); A += chargeAmount(c); });
  return {liters: round1(L), amount: Math.round(A)};
}
function dayHasData(d){
  if(!d) return false;
  var inc = d.income||{}, ds = d.distance||{};
  return !!((d.runs&&d.runs.length)||num(inc.card)||num(inc.cash)||num(inc.direct)||num(inc.toll)||num(ds.total)||num(ds.business)||
    (d.expenses&&d.expenses.length)||(d.charges&&d.charges.length)||(d.memo&&String(d.memo).trim())||
    (d.photos&&d.photos.length)||d.off||(d.gps&&d.gps.points&&d.gps.points.length));
}
function workDayOf(d, nowTs){
  if(!d) return false;
  var inc = incomeOf(d);
  return !d.off && (dayWorkMinutes(d, nowTs)>0 || inc.sales>0);
}
function monthStats(days, ym, nowTs){
  var out = {ym:ym, sales:0, card:0, cash:0, toll:0, expenses:0, chargeLiters:0, chargeAmount:0,
    km:0, bizKm:0, workMinutes:0, workDays:0, rideRate:null, fuelEco:null, avgMinutes:0, hourly:0, net:0, gpsPoints:0};
  var keys = Object.keys(days||{}).filter(function(k){ return k.slice(0,7)===ym; });
  keys.forEach(function(k){
    var d = days[k]; if(!d) return;
    var inc = incomeOf(d);
    out.sales += inc.sales; out.card += inc.card; out.cash += inc.cash; out.toll += inc.toll;
    out.expenses += expenseTotal(d);
    var c = chargeTotals(d);
    out.chargeLiters += c.liters; out.chargeAmount += c.amount;
    out.km += num(d.distance && d.distance.total);
    out.bizKm += num(d.distance && d.distance.business);
    out.workMinutes += dayWorkMinutes(d, nowTs);
    if(workDayOf(d, nowTs)) out.workDays++;
    if(d.gps && d.gps.points) out.gpsPoints += d.gps.points.length;
  });
  out.chargeLiters = round1(out.chargeLiters);
  out.rideRate = out.km>0 ? round1(out.bizKm/out.km*100) : null;
  out.fuelEco = out.chargeLiters>0 ? round1(out.km/out.chargeLiters) : null;
  out.avgMinutes = out.workDays>0 ? out.workMinutes/out.workDays : 0;
  out.hourly = out.workMinutes>0 ? out.sales/(out.workMinutes/60) : 0;
  out.net = out.sales - out.expenses - out.chargeAmount;
  return out;
}
function calendarCells(year, month){
  var first = new Date(year, month-1, 1);
  var startDow = first.getDay();

/* 상호 비교용 열쇠 — 공백·법인 표기·괄호를 지워 '대성산업(주)오류동충전소'와 '대성산업오류동충전소'를 같게 본다. */
function opinetNameKey(name){
  return String(name === undefined || name === null ? '' : name)
    .replace(/\(주\)|\(유\)|\(사\)|\(합\)|주식회사|유한회사|㈜/g, '')
    .replace(/[\s\-_.·,()\[\]{}'"`~!@#$%^&*+=|\\/?:;<>]/g, '')
    .toLowerCase();
}
/* 중계(Worker) 호출 주소: <proxyUrl>?ep=<endpoint>&code=<opinetKey>&... */
function opinetUrlFor(base, key, ep, params){
  var b = String(base === undefined || base === null ? '' : base).replace(/\s+/g, '').replace(/\/+$/, '');
  var k = String(key === undefined || key === null ? '' : key).replace(/\s+/g, '');
  var e = String(ep === undefined || ep === null ? '' : ep).trim();
  if(!b || !k || OPINET_EPS.indexOf(e) === -1) return '';
  var qs = ['ep=' + encodeURIComponent(e), 'code=' + encodeURIComponent(k)];
  var p = params || {};
  Object.keys(p).forEach(function(name){
    var v = p[name];
    if(v === '' || v === null || v === undefined) return;
    qs.push(encodeURIComponent(name) + '=' + encodeURIComponent(String(v)));
  });
  return b + (b.indexOf('?') === -1 ? '?' : '&') + qs.join('&');
}
/* 오피넷 응답(RESULT.OIL)을 충전소 목록으로 — 배열·한 건·빈 응답 모두 받아 준다. */
function parseOpinetOils(data){
  var src = null;
  try{
    var r = data && data.RESULT && data.RESULT.OIL;
    if(Array.isArray(r)) src = r;
    else if(r && typeof r === 'object') src = [r];
  }catch(e){ src = null; }
  if(!src){
    if(data && Array.isArray(data.OIL)) src = data.OIL;
    else if(Array.isArray(data)) src = data;
  }
  var out = [], seen = {};
  (src || []).forEach(function(o){
    if(!o || typeof o !== 'object') return;
    var name = String(o.OS_NM === undefined || o.OS_NM === null ? '' : o.OS_NM).replace(/\s+/g, ' ').trim();
    var price = num(o.PRICE);
    if(!name || !(price > 0)) return;
    var nk = opinetNameKey(name);
    if(!nk || seen[nk]) return;
    seen[nk] = 1;
    var dist = num(o.DISTANCE);
    out.push({
      name: name,
      price: Math.round(price),
      id: o.UNI_ID ? String(o.UNI_ID) : '',
      brand: o.POLL_DIV_CD ? String(o.POLL_DIV_CD) : '',
      distance: dist > 0 ? Math.round(dist) : 0,
      addr: String(o.NEW_ADR || o.VAN_ADR || '')
    });
  });
  return out;
}
/* 이름이 조금 달라도 같은 충전소를 찾는다(정확히 같은 이름 → 공백·법인표기 무시). */
function findStationLoose(settings, name){
  var exact = findStation(settings, name);
  if(exact) return exact;
  var k = opinetNameKey(name);
  if(!k) return null;
  var list = (settings && Array.isArray(settings.stations)) ? settings.stations : [];
  for(var i=0;i<list.length;i++){ if(opinetNameKey(list[i].name) === k) return list[i]; }
  return null;
}
/* 실시간 단가를 충전소 목록에 반영한다. 단골 충전소는 이름을 그대로 두고 단가·시각만 새로 쓴다. */
function mergeOpinetStations(settings, oils, ts, maxNew){
  var out = {updated: 0, added: 0, matched: []};
  if(!settings) return out;
  var at = num(ts) || Date.now();
  var cap = num(maxNew) > 0 ? num(maxNew) : 8;
  (Array.isArray(oils) ? oils : []).forEach(function(o){
    if(!o) return;
    var name = String(o.name === undefined || o.name === null ? '' : o.name).replace(/\s+/g, ' ').trim();
    var price = Math.round(num(o.price));
    if(!name || !(price > 0)) return;
    var mem = findStationLoose(settings, name);
    if(mem){
      if(Math.round(num(mem.unit)) !== price) out.updated++;
      mem.unit = price;
      if(!mem.fuel) mem.fuel = 'LPG';
      /* 사용자가 마지막으로 쓴 순서(updated)는 건드리지 않는다 — 새 충전 행에 채워지는 '마지막 충전소'가 바뀌면 안 된다. */
      out.matched.push({name: mem.name, liveName: name, price: price});
      return;
    }
    if(out.added >= cap) return;
    /* 새로 담는 실시간 충전소도 개인 사용 기록은 없다(updated 0) — 단가만 미리 채워 둔다. */
    settings.stations.push({name: name, fuel: 'LPG', unit: price, updated: 0});
    out.added++;
    out.matched.push({name: name, liveName: name, price: price});
  });
  settings.stations = normalizeStations(settings.stations);
  return out;
}
/* 지금 열어 둔 날짜의 충전 행 중 이름이 맞는 행에 실시간 단가·금액을 채운다. */
function applyOpinetToDay(day, oils, ts){
  var applied = [];
  if(!day || !Array.isArray(day.charges)) return applied;
  (oils || []).forEach(function(o){ /* 쓰지 않음 — 아래에서 행 기준으로 찾는다 */ });
  day.charges.forEach(function(c){
    if(!c || !stationKey(c.station)) return;
    if(c.fuel && c.fuel !== 'LPG') return;   /* 오피넷에서 받는 값은 LPG 단가다 */
    var hit = null;
    for(var i=0;i<(oils || []).length;i++){
      if(opinetNameKey(oils[i].name) === opinetNameKey(c.station)){ hit = oils[i]; break; }
    }
    if(!hit) return;
    var price = Math.round(num(hit.price));
    if(!(price > 0) || Math.round(num(c.unit)) === price) return;
    /* 금액을 손으로 넣어 둔 행(할인·쿠폰 등)은 금액을 그대로 두고 단가만 새로 쓴다. */
    var liters = num(c.liters), oldUnit = num(c.unit), oldAmount = num(c.amount);
    var autoAmount = !(oldAmount > 0) || (liters > 0 && oldUnit > 0 && Math.abs(oldAmount - liters * oldUnit) <= 1);
    c.unit = price;
    if(!c.fuel) c.fuel = 'LPG';
    if(autoAmount) syncChargeAmounts(c, 'unit');
    applied.push({name: c.station, price: price, amount: num(c.amount), keptAmount: !autoAmount});
  });
  if(applied.length) day.u = num(ts) || Date.now();
  return applied;
}
/* ---------- 좌표: WGS84(위경도) → KATEC(오피넷 좌표) ---------- */
/* KATEC = Bessel1841 타원체, TM 중부원점(위도 38°·경도 128°), k=0.9999, 원점 400000/600000 */
var WGS84_ELL = {a: 6378137.0, e2: 0.0066943799901413165};
var KATEC_ELL = {a: 6377397.155, e2: 0.006674372230614};
var KATEC_TM = {lat0: 38, lon0: 128, k0: 0.9999, x0: 400000, y0: 600000};
/* WGS84 → Bessel 7-파라미터(위치벡터) — 국내 KATEC 변환에 널리 쓰는 값 */
var KATEC_DATUM = {dx: -115.80, dy: 474.99, dz: 674.11, rx: 1.16, ry: -2.31, rz: -1.63, ds: 6.43};
function toRad(d){ return d * Math.PI / 180; }
function toDeg(r){ return r * 180 / Math.PI; }
function geoToGeocent(latDeg, lonDeg, ell){
  var lat = toRad(latDeg), lon = toRad(lonDeg);
  var sp = Math.sin(lat), cp = Math.cos(lat), sl = Math.sin(lon), cl = Math.cos(lon);
  var n = ell.a / Math.sqrt(1 - ell.e2 * sp * sp);
  return {x: n * cp * cl, y: n * cp * sl, z: n * (1 - ell.e2) * sp};
}
function geocentToGeo(x, y, z, ell){
  var lon = Math.atan2(y, x);
  var p = Math.sqrt(x * x + y * y);
  var lat = Math.atan2(z, p * (1 - ell.e2));
  for(var i=0;i<8;i++){
    var sp = Math.sin(lat);
    var n = ell.a / Math.sqrt(1 - ell.e2 * sp * sp);
    var next = Math.atan2(z + ell.e2 * n * sp, p);
    if(Math.abs(next - lat) < 1e-12){ lat = next; break; }
    lat = next;
  }
  return {lat: toDeg(lat), lon: toDeg(lon)};
}
function datumToBessel(p){
  var sec = Math.PI / (180 * 3600);
  var rx = KATEC_DATUM.rx * sec, ry = KATEC_DATUM.ry * sec, rz = KATEC_DATUM.rz * sec;
  var m = 1 + KATEC_DATUM.ds * 1e-6;
  var x = (p.x - KATEC_DATUM.dx) / m, y = (p.y - KATEC_DATUM.dy) / m, z = (p.z - KATEC_DATUM.dz) / m;
  return {x: x + rz * y - ry * z, y: -rz * x + y + rx * z, z: ry * x - rx * y + z};
}
function meridianArc(lat, ell){
  var e2 = ell.e2, e4 = e2 * e2, e6 = e4 * e2;
  return ell.a * ((1 - e2 / 4 - 3 * e4 / 64 - 5 * e6 / 256) * lat
    - (3 * e2 / 8 + 3 * e4 / 32 + 45 * e6 / 1024) * Math.sin(2 * lat)
    + (15 * e4 / 256 + 45 * e6 / 1024) * Math.sin(4 * lat)
    - (35 * e6 / 3072) * Math.sin(6 * lat));
}
function katecTmForward(latDeg, lonDeg){
  var a = KATEC_ELL.a, e2 = KATEC_ELL.e2, ep2 = e2 / (1 - e2);
  var la = toRad(latDeg), lo = toRad(lonDeg);
  var sp = Math.sin(la), cp = Math.cos(la), tp = Math.tan(la);
  var n = a / Math.sqrt(1 - e2 * sp * sp);
  var t = tp * tp, c = ep2 * cp * cp, aa = (lo - toRad(KATEC_TM.lon0)) * cp;
  var m = meridianArc(la, KATEC_ELL) - meridianArc(toRad(KATEC_TM.lat0), KATEC_ELL);
  var a2 = aa * aa, a3 = a2 * aa, a4 = a3 * aa, a5 = a4 * aa, a6 = a5 * aa;
  return {
    x: KATEC_TM.x0 + KATEC_TM.k0 * n * (aa + (1 - t + c) * a3 / 6 + (5 - 18 * t + t * t + 72 * c - 58 * ep2) * a5 / 120),
    y: KATEC_TM.y0 + KATEC_TM.k0 * (m + n * tp * (a2 / 2 + (5 - t + 9 * c + 4 * c * c) * a4 / 24 + (61 - 58 * t + t * t + 600 * c - 330 * ep2) * a6 / 720))
  };
}
function wgs84ToKatec(lat, lng){
  if(lat === '' || lng === '' || lat === null || lng === null || lat === undefined || lng === undefined) return null;
  var la = Number(lat), lo = Number(lng);
  if(!isFinite(la) || !isFinite(lo)) return null;
  if(Math.abs(la) > 90 || Math.abs(lo) > 180) return null;
  if(la === 0 && lo === 0) return null;
  var g = geoToGeocent(la, lo, WGS84_ELL);
  var b = datumToBessel(g);
  var geo = geocentToGeo(b.x, b.y, b.z, KATEC_ELL);
  var xy = katecTmForward(geo.lat, geo.lon);
  if(!isFinite(xy.x) || !isFinite(xy.y)) return null;
  return {x: Math.round(xy.x * 100) / 100, y: Math.round(xy.y * 100) / 100};
}

function defaultState(){
  return {
    version: 1,
    settings: {vehicle:'K5 LPI', plate:'서울 00자 0000', fuel:'LPG', offWeekdays:[], offMemo:'', gmapsKey:'', oauthClientId:'', opinetKey:'', opinetProxyUrl:'', opinetAt:0, stations:defaultStations(), stationsSeeded:DEFAULT_STATIONS_SEED},
    settingsUpdated: 0,
    days: {},
    deleted: {},
    meta: {created: Date.now()},
    session: null
  };
}
function normalizeState(raw){
  var s = defaultState();
  if(!raw || typeof raw !== 'object') return s;
  var st = raw.settings || {};
  var hasStations = Array.isArray(st.stations);
  s.settings = {
    vehicle: (typeof st.vehicle==='string' && st.vehicle) ? st.vehicle : 'K5 LPI',
    plate: (typeof st.plate==='string' && st.plate) ? st.plate : '서울 00자 0000',
    fuel: (typeof st.fuel==='string' && st.fuel) ? st.fuel : 'LPG',
    offWeekdays: Array.isArray(st.offWeekdays) ? st.offWeekdays.map(Number).filter(function(x){return x>=0 && x<=6;}) : [],
    offMemo: typeof st.offMemo==='string' ? st.offMemo : '',
    gmapsKey: typeof st.gmapsKey==='string' ? st.gmapsKey : '',
    oauthClientId: typeof st.oauthClientId==='string' ? st.oauthClientId : '',
    /* 오피넷 키는 이 기기에만 저장하고 클라우드 동기화에서 뺀다. */
    opinetKey: typeof st.opinetKey==='string' ? st.opinetKey : '',
    opinetProxyUrl: typeof st.opinetProxyUrl==='string' ? st.opinetProxyUrl : '',
    opinetAt: num(st.opinetAt),
    /* 저장된 목록이 아직 없는 상태(처음 실행·예전 기록)면 기본 충전소를 깔아 둔다. */
    stations: hasStations ? normalizeStations(st.stations) : defaultStations(),
    stationsSeeded: hasStations ? num(st.stationsSeeded) : DEFAULT_STATIONS_SEED
  };
  s.settingsUpdated = num(raw.settingsUpdated);
  var days = raw.days || {};
  Object.keys(days).forEach(function(k){
    if(/^\d{4}-\d{2}-\d{2}$/.test(k)) s.days[k] = normalizeDay(days[k]);
  });
  var dels = raw.deleted || {};
  Object.keys(dels).forEach(function(k){
    if(/^\d{4}-\d{2}-\d{2}$/.test(k)) s.deleted[k] = num(dels[k]);
  });
  s.meta = {created: num(raw.meta && raw.meta.created) || Date.now()};
  if(raw.session && raw.session.start && parseDT(raw.session.start)){
    s.session = {start:String(raw.session.start), dayKey:String(raw.session.dayKey||'')};
  }
  return s;
}
function loadAll(){
  var raw = null;
  try{
    var txt = localStorage.getItem(STORE_KEY);

    state = normalizeState(raw);
  }catch(e){ state = defaultState(); raw = null; }
  /* 충전소 기억 목록이 생기기 전에 쌓인 기록에서 충전소 이름·단가를 한 번만 모아 둔다. */
  try{
    if(raw && raw.settings && !Array.isArray(raw.settings.stations)){
      if(seedStationsFromDays(state)) saveLocal();
    }
    /* 기본 충전소는 한 번만 깐다. 그 뒤에 사용자가 지우거나 단가를 바꾼 값은 건드리지 않는다. */
    if(raw && raw.settings && num(raw.settings.stationsSeeded) < DEFAULT_STATIONS_SEED){
      mergeDefaultStations(state.settings);
      state.settings.stationsSeeded = DEFAULT_STATIONS_SEED;
      saveLocal();
    }
  }catch(e){}
  try{
    var m = localStorage.getItem(SYNC_META_KEY);
    if(m){ var p = JSON.parse(m); if(p && typeof p==='object'){ syncMeta.email = p.email||''; syncMeta.lastSyncAt = num(p.lastSyncAt); syncMeta.fileId = p.fileId||''; } }

  try{ if(recoverSession()) saveLocal(); }catch(e){}
}

/* START를 누른 뒤 페이지가 새로 열리거나 동기화가 들어와 화면 상태가 비어도,
   오늘(또는 어제) 기록에 시작만 있고 종료가 비어 있는 운행이 있으면 운행 중
   상태로 되살린다. STOP 버튼이 사라지고 다시 START가 뜨는 일을 막는다. */
function recoverSession(){
  if(!state || !state.days) return false;
  if(state.session) return false;
  var now = new Date();
  var keys = [dateKey(now)];
  var y = new Date(now.getTime());
  y.setDate(y.getDate() - 1);
  keys.push(dateKey(y));
  for(var i=0;i<keys.length;i++){
    var d = state.days[keys[i]];
    var runs = (d && Array.isArray(d.runs)) ? d.runs : [];
    for(var j=runs.length-1;j>=0;j--){
      var r = runs[j];
      if(r && r.s && !r.e && parseDT(r.s)){
        state.session = {start: String(r.s), dayKey: keys[i]};
        return true;
      }
    }
  }
  return false;
}

/* ---------- 홈 ---------- */
views.home = function(){
  var now = new Date(), ts = now.getTime();
  var today = dateKey(now), ym = today.slice(0,7);
  var stats = monthStats(state.days, ym, ts);
  var day = state.days[today];
  var inc = incomeOf(day);
  var todayMin = dayWorkMinutes(day, ts);
  var sess = state.session;
  var startAt = sess ? parseDT(sess.start) : null;
  var elapsed = startAt ? Math.max(0, ts - startAt.getTime()) : 0;
  var stale = !!(sess && elapsed > 20*3600*1000);
  var pts = (day && day.gps && day.gps.points) || [];
  var courseUrl = buildMapsDirUrl(pts);
  var pattern = (state.settings.offWeekdays || []).map(function(x){ return WEEKDAYS[x]; }).join('·');
  var todayHourly = todayMin > 0 ? fmtNum(inc.sales/(todayMin/60))+'원' : '';
  var ch = chargeTotals(day);
  var chUnit = ch.liters > 0 ? Math.round(ch.amount/ch.liters) : 0;
  var dist = (day && day.distance) || {};
  var km = num(dist.total), bizKm = num(dist.business);
  var rideRate = km > 0 ? round1(bizKm/km*100) : null;
  var runs = runsOf(day);
  var lastRun = null;
  for(var ri=0; ri<runs.length; ri++){ if(runs[ri] && runs[ri].s) lastRun = runs[ri]; }
  var startTxt = sess ? hm(sess.start) : (lastRun ? hm(lastRun.s) : '--:--');
  var endTxt = sess ? '--:--' : ((lastRun && lastRun.e) ? hm(lastRun.e) : '--:--');
  var clockTxt = sess ? fmtClock(elapsed) : fmtClock(todayMin*60000);
  var subTxt = sess
    ? (hm(sess.start) + ' 시작 · ' + fmtDur(elapsed/60000) + ' 경과')
    : (todayMin > 0 ? ('오늘 누적 ' + fmtDur(todayMin) + ' · 영업금액 ' + fmtWon(inc.sales)) : 'START를 누르면 오늘 운행이 기록됩니다');
  var workVal = Math.floor(todayMin/60) + '<span class="unit">h</span> ' + pad2(todayMin%60) + '<span class="unit">m</span>';
  var dayChip = (day && day.off)
    ? '<span class="chip off">휴무</span>'
    : (sess ? '<span class="chip off">' + icon('clock') + '운행 중</span>'
            : (todayMin > 0 ? '<span class="chip">' + icon('trend') + '영업일</span>' : '<span class="chip off">기록 전</span>'));

  var staleBox = stale ? ('<div class="warn-box" style="margin:0 0 12px">'
    + '<b>START가 ' + fmtDur(elapsed/60000) + '째 켜져 있습니다.</b><br>'
    + '잠깐 누른 채 잊으셨다면 지금 STOP을 누르거나, 입력 화면에서 종료 시각을 직접 고쳐 주세요.'
    + '<div class="row" style="margin-top:9px;gap:6px"><button class="btn btn-sm btn-soft" data-act="goInputToday">입력에서 고치기</button>'
    + '<button class="btn btn-sm btn-red" data-act="stop">지금 STOP</button></div></div>') : '';

  return ''
  + staleBox
  + (storageOK ? '' : '<div class="warn-box" style="margin:0 0 12px"><b>이 브라우저에서는 자동 저장이 막혀 있습니다.</b><br>기록이 사라질 수 있으니 https:// 주소로 올려 열거나, 설정에서 JSON 백업을 자주 받아 두세요.</div>')
  + '<div class="home-head">'
  +   '<div><p class="date">' + (now.getMonth()+1) + '월 ' + now.getDate() + '일 ' + WEEKDAYS[now.getDay()] + '요일</p>'
  +   '<h1 class="hello">오늘도 <em>안전운행</em></h1></div>'
  +   '<div class="veh-badge" title="' + esc(state.settings.plate || '') + '" aria-label="내 차량 ' + esc(state.settings.plate || '') + '">' + icon('car')
  +     (sess ? '<span class="live-dot" aria-hidden="true"></span>' : '') + '</div>'
  + '</div>'

  + '<section class="summary" aria-label="오늘 요약">'
  +   '<div class="card hero">'
  +     '<div>'
  +       '<p class="label">' + icon('wallet') + '오늘 운송수입금</p>'
  +       '<p class="value num" id="todaySales">' + fmtWon(inc.sales) + '</p>'
  +       '<p class="sub">카드 ' + fmtWon(inc.card) + ' · 현금 ' + fmtWon(inc.cash) + (inc.toll ? ' · 통행료 ' + fmtWon(inc.toll) : '') + '</p>'
  +     '</div>'
  +     dayChip
  +   '</div>'
  +   '<div class="card">'
  +     '<p class="label">' + icon('clock') + '오늘 일한 시간</p>'
  +     '<p class="value num" id="todayWork">' + workVal + '</p>'
  +     '<p class="sub">' + (todayHourly ? '시간당 매출 ' + todayHourly : 'START를 누르면 시간이 쌓입니다') + '</p>'
  +   '</div>'
  +   '<div class="card">'
  +     '<p class="label">' + icon('fuel') + '오늘 LPG 충전</p>'
  +     '<p class="value num">' + (ch.amount ? fmtWon(ch.amount) : '－') + '</p>'
  +     '<p class="sub">' + (ch.liters > 0
          ? ('<span class="amber num">' + fmtDec1(ch.liters) + 'L</span>' + (chUnit > 0 ? ' · ' + fmtNum(chUnit) + '원/L' : ''))
          : '충전 기록 없음') + '</p>'
  +   '</div>'
  + '</section>'

  + '<section class="drive' + (sess ? ' running' : '') + '" id="drive" aria-label="운행 기록">'
  +   '<p class="elapsed-label"><span class="dot"></span><span id="stateLabel">' + (sess ? '운행 중' : (todayMin > 0 ? '오늘 누적' : '대기 중')) + '</span></p>'
  +   '<p class="elapsed num" id="elapsedClock" aria-live="polite">' + clockTxt + '</p>'
  +   '<p class="run-sub" id="runSub">' + esc(subTxt) + '</p>'
  +   '<div class="btn-wrap">'
  +     '<span class="ring" aria-hidden="true"></span>'
  +     (sess
        ? '<button class="toggle" id="toggle" data-act="stop" aria-pressed="true">' + icon('stop') + '<span class="t">STOP</span><span class="s">운행 종료</span></button>'
        : '<button class="toggle" id="toggle" data-act="start" aria-pressed="false">' + icon('play') + '<span class="t">START</span><span class="s">운행 시작</span></button>')
  +   '</div>'
  +   '<div class="times">'
  +     '<div class="t"><p class="k">시작 시각</p><p class="v num' + (startTxt === '--:--' ? ' empty' : '') + '" id="startAt">' + startTxt + '</p></div>'
  +     '<span class="div" aria-hidden="true"></span>'
  +     '<div class="t"><p class="k">종료 시각</p><p class="v num' + (endTxt === '--:--' ? ' empty' : '') + '" id="endAt">' + endTxt + '</p></div>'
  +   '</div>'
  + '</section>'

  + '<section aria-label="오늘 운행 코스">'
  +   '<div class="section-h"><h2>오늘 운행 코스</h2><span class="sec-meta">GPS ' + pts.length + '지점</span></div>'
  +   '<div class="card map">'
  +     mapBoxHtml('homeMap', pts)
  +     '<div class="map-stats">'
  +       '<div><p class="k">주행거리</p><p class="v num">' + fmtDec1(km) + '<span class="unit">km</span></p></div>'
  +       '<div><p class="k">영업거리</p><p class="v num">' + fmtDec1(bizKm) + '<span class="unit">km</span></p></div>'
  +       '<div><p class="k">승차율</p><p class="v num' + (rideRate === null ? '' : ' hi') + '">' + (rideRate === null ? '－' : rideRate + '<span class="unit">%</span>') + '</p></div>'
  +     '</div>'
  +     '<div class="map-foot">'
  +       (courseUrl
          ? '<a class="btn btn-primary btn-block" href="' + esc(courseUrl) + '" target="_blank" rel="noopener">구글 지도에서 오늘 코스 열기</a>'
          : '<button class="btn btn-block" disabled>구글 지도에서 오늘 코스 열기</button>')
  +       '<div class="tiny muted" style="margin-top:8px;line-height:1.5;text-align:center" id="gpsLine"></div>'
  +     '</div>'
  +   '</div>'
  + '</section>'

  + '<div class="section-h" style="margin-top:6px"><h2>이번 달</h2><a href="#" data-act="nav" data-screen="calendar">전체 보기 ' + icon('chevron') + '</a></div>'
  + '<section class="sum-card">'
  +   '<div class="sum-head"><span>' + ymLabel(ym) + '</span><span>근무 ' + stats.workDays + '일' + (pattern ? ' · 부제 ' + pattern : '') + '</span></div>'
  +   '<div class="big">' + fmtWon(stats.sales) + '</div>'
  +   '<div class="sum-grid">'
  +     '<div class="sum-item"><div class="k">카드수입</div><div class="v">' + fmtWon(stats.card) + '</div></div>'
  +     '<div class="sum-item"><div class="k">현금수입</div><div class="v">' + fmtWon(stats.cash) + '</div></div>'
  +     '<div class="sum-item"><div class="k">통행료</div><div class="v">' + fmtWon(stats.toll) + '</div></div>'
  +     '<div class="sum-item"><div class="k">총 운행시간</div><div class="v">' + fmtDur(stats.workMinutes) + '</div></div>'
  +     '<div class="sum-item"><div class="k">일평균 운행시간</div><div class="v">' + (stats.workDays ? fmtDur(stats.avgMinutes) : '－') + '</div></div>'
  +     '<div class="sum-item"><div class="k">시간당 평균 매출</div><div class="v">' + (stats.workMinutes > 0 ? fmtNum(stats.hourly)+'원/h' : '－') + '</div></div>'
  +   '</div>'
  +   '<div class="sum-foot"><span>지출 <b>' + fmtWon(stats.expenses) + '</b></span><span>충전 <b>' + fmtWon(stats.chargeAmount) + '</b></span><span>순수입 <b>' + fmtWon(stats.net) + '</b></span></div>'
  + '</section>'

  + '<section class="card">'
  +   '<div class="card-h"><div class="card-t">주행 · LPG</div><div class="card-sub">' + ymLabel(ym) + '</div></div>'
  +   '<div class="grid3">'
  +     '<div class="kpi"><div class="v">' + fmtDec1(stats.km) + '<span class="tiny muted"> km</span></div><div class="l">총 주행거리</div></div>'
  +     '<div class="kpi"><div class="v">' + fmtDec1(stats.bizKm) + '<span class="tiny muted"> km</span></div><div class="l">영업거리</div></div>'
  +     '<div class="kpi"><div class="v hi">' + (stats.rideRate===null ? '－' : stats.rideRate + '%') + '</div><div class="l">승차율</div></div>'
  +   '</div>'
  +   '<div class="grid3" style="margin-top:8px">'
  +     '<div class="kpi"><div class="v">' + fmtDec1(stats.chargeLiters) + '<span class="tiny muted"> L</span></div><div class="l">총 충전량</div></div>'
  +     '<div class="kpi"><div class="v amber">' + fmtWon(stats.chargeAmount) + '</div><div class="l">충전금액</div></div>'
  +     '<div class="kpi"><div class="v">' + (stats.fuelEco===null ? '－' : stats.fuelEco) + '<span class="tiny muted"> km/L</span></div><div class="l">평균 연비</div></div>'
  +   '</div>'
  + '</section>'

  + '<section class="card">'
  +   '<div class="card-h"><div class="card-t">이번 달 달력</div><a class="small" href="#" data-act="nav" data-screen="calendar" style="color:var(--muted)">전체 보기 ›</a></div>'
  +   miniCalendarHtml(today)
  + '</section>';
};

function miniCalendarHtml(today){
  var ym = today.slice(0,7);
  var p = ym.split('-');
  var y = Number(p[0]), mo = Number(p[1]);
  var cells = calendarCells(y, mo);
  var html = '<div class="cal-dow">' + WEEKDAYS.map(function(w){ return '<div>'+w+'</div>'; }).join('') + '</div>';
  html += '<div class="cal-grid">';
  cells.forEach(function(c){
    if(!c){ html += '<div class="cell empty mini"></div>'; return; }
    var d = state.days[c.key];
    var off = d && d.off;
    var pat = isPatternOff(c.key, state.settings.offWeekdays);
    var mins = d ? dayWorkMinutes(d, Date.now()) : 0;
    var cls = 'cell mini' + (c.dow===0?' sun':'') + (c.dow===6?' sat':'') + (off?' off':'') + (pat&&!off?' pat':'') + (c.key===today?' today':'');
    html += '<div class="' + cls + '" data-act="openDay" data-key="' + c.key + '" title="' + esc(c.key + (off?' 휴무':(mins?' '+fmtDur(mins):''))) + '">'
      + '<div class="d">' + c.d + '</div>'
      + (mins>0 ? '<div class="hr">' + fmtDurShort(mins) + '</div>' : '')
      + (off ? '<div class="offtag">휴</div>' : '')
      + '</div>';
  });
  html += '</div>';
  html += '<div class="legend"><span><i style="background:rgba(245,158,11,.16)"></i>휴무</span><span><i style="background:rgba(255,255,255,.06)"></i>부제</span><span><i style="background:#34D399"></i>일한 시간</span></div>';
  return html;
}

/* ---------- 입력 ---------- */
views.input = function(){
  var key = ui.date;
  var stored = state.days[key];
  var d = stored || blankDay();
  var nowTs = Date.now();
  var inc = incomeOf(d);
  var work = dayWorkMinutes(stored || {}, nowTs);
  var runs = (d.runs && d.runs.length) ? d.runs : [{s:'', e:''}];
  var exp = expenseTotal(d);
  var ch = chargeTotals(d);
  var dist = d.distance || {};
  var km = num(dist.total), biz = num(dist.business);
  var rate = km > 0 ? round1(biz/km*100) : null;
  var pts = (d.gps && d.gps.points) || [];
  var courseUrl = buildMapsDirUrl(pts);
  var gpsKm = gpsDistanceKm(pts);
  var live = !!(state.session && state.session.dayKey === key);
  var warn = '';
  runs.forEach(function(r){
    var s = parseDT(r.s), e = parseDT(r.e);
    if(s && e && e.getTime() <= s.getTime()) warn = '종료 시각이 시작보다 빠릅니다. 날짜를 확인해 주세요.';
  });
  var pattern = (state.settings.offWeekdays || []).map(function(x){ return WEEKDAYS[x]; }).join('·');
  var stationOpts = normalizeStations(state.settings.stations);

  return ''
  + '<section class="card tight" style="display:flex;align-items:center;gap:10px">'
  +   '<button class="btn btn-sm" data-act="prevDay" aria-label="이전 날">◀</button>'
  +   '<div style="flex:1;text-align:center;min-width:0">'
  +     '<div style="font-size:15.5px;font-weight:800">' + dateLabelKR(key) + ' <span class="muted" style="font-weight:700">(' + weekdayKR(key) + ')</span></div>'
  +     '<button class="btn btn-ghost btn-sm" data-act="today" style="min-height:26px;font-size:11.5px">오늘로</button>'
  +   '</div>'
  +   '<button class="btn btn-sm" data-act="nextDay" aria-label="다음 날">▶</button>'
  + '</section>'

  + '<section class="card">'
  +   '<div class="card-h"><div class="card-t">운행 시간</div>'
  +     '<span class="chip ' + (live ? 'live' : '') + '" id="liveChip">' + (live ? '운행 중 ' + fmtClock(nowTs - (parseDT(state.session.start)||new Date()).getTime()) : '일한 시간') + '</span></div>'
  +   runs.map(function(r, i){
        return '<div class="run-row">'
        + '<div class="rr-top"><b class="small">' + (i===0 ? '운행' : '추가 운행 ' + (i+1)) + '</b>'
        + (i>0 ? '<button class="del-x" data-act="delRun" data-idx="' + i + '" aria-label="삭제">✕</button>' : '') + '</div>'
        + '<div class="run-fields">'
        +   '<div class="field"><label>운행시작</label><input type="datetime-local" data-day="' + key + '" data-field="runs.' + i + '.s" value="' + esc(r.s) + '"></div>'
        +   '<div class="field"><label>운행종료</label><input type="datetime-local" data-day="' + key + '" data-field="runs.' + i + '.e" value="' + esc(r.e) + '"></div>'
        + '</div>'
        + '<div class="tiny muted" style="margin-top:5px">' + (r.s && r.e ? '이 운행 ' + fmtDur(runMinutes(r, nowTs)) : (r.s && !r.e ? (key === todayKey() ? '진행 중 (STOP 전까지 계속 계산)' : '종료 시각이 비어 있습니다') : '')) + '</div>'
        + '</div>';
      }).join('')
  +   '<div class="row wrap" style="gap:8px;margin-top:6px">'
  +     '<button class="btn btn-sm btn-soft" data-act="addRun">+ 운행 추가</button>'
  +     (live ? '<button class="btn btn-sm btn-red" data-act="stop">STOP</button>' : '')
  +     '<div class="spacer"></div>'
  +     '<div class="field" style="width:132px"><label>휴식(분) 차감</label><input class="num" type="number" inputmode="numeric" min="0" placeholder="0" data-day="' + key + '" data-field="breakMinutes" value="' + esc(ival(d.breakMinutes)) + '"></div>'
  +   '</div>'
  +   '<div class="total-line" style="margin-top:10px"><span>총 일한 시간</span><b id="workTotal">' + fmtDur(work) + '</b></div>'
  +   '<div class="total-line" style="margin-top:6px"><span>시간당 매출</span><b id="hourlyRev">' + (work>0 ? fmtNum(inc.sales/(work/60))+'원' : '－') + '</b></div>'
  +   '<div class="tiny" id="runWarn" style="margin-top:7px;color:var(--rose);' + (warn?'':'display:none') + '">' + esc(warn) + '</div>'
  + '</section>'

  + '<section class="card">'
  +   '<div class="card-h"><div class="card-t">수입</div>'
  +     '<div class="seg" style="width:168px">'
  +       '<button class="' + (d.income.mode!=='direct'?'on':'') + '" data-act="incomeMode" data-mode="auto">자동합산</button>'
  +       '<button class="' + (d.income.mode==='direct'?'on':'') + '" data-act="incomeMode" data-mode="direct">직접입력</button>'
  +     '</div></div>'
  +   '<div class="grid3">'

function courseSpanText(pts){
  if(!pts || !pts.length) return 'GPS 기록이 없습니다. 홈에서 START를 누르면 이동 경로가 쌓입니다.';
  var a = new Date(pts[0].t), b = new Date(pts[pts.length-1].t);
  return '시작 ' + pad2(a.getHours()) + ':' + pad2(a.getMinutes()) + ' · 마지막 ' + pad2(b.getHours()) + ':' + pad2(b.getMinutes()) + ' · ' + pts.length + '지점';
}

function calCellHtml(c, today){
  if(!c) return '<div class="cell empty"></div>';
  var d = state.days[c.key];
  var inc = incomeOf(d);
  var mins = d ? dayWorkMinutes(d, Date.now()) : 0;
  var off = !!(d && d.off);
  var pat = isPatternOff(c.key, state.settings.offWeekdays);
  var cls = 'cell' + (c.dow===0?' sun':'') + (c.dow===6?' sat':'') + (off?' off':'') + (pat&&!off?' pat':'') + (c.key===today?' today':'');
  var html = '<div class="' + cls + '" data-act="openDay" data-key="' + c.key + '" title="' + esc(c.key + ' · ' + (off ? '휴무' : fmtDur(mins)) + ' · ' + fmtWon(inc.sales)) + '">';
  html += '<div class="d">' + c.d + '</div>';
  if(mins > 0) html += '<div class="hr">' + fmtDurShort(mins) + '</div>';
  if(off) html += '<div class="offtag">휴무</div>';
  if(inc.sales > 0) html += '<div class="amt sales">' + fmtMan(inc.sales) + '</div>';
  if(inc.card > 0) html += '<div class="amt kcard">' + fmtMan(inc.card) + '</div>';
  if(inc.cash > 0) html += '<div class="amt kcash">' + fmtMan(inc.cash) + '</div>';
  html += '</div>';
  return html;
}

views.stats = function(){
  var years = dataYears();
  var y = ui.year;
  if(years.indexOf(String(y)) === -1) years.unshift(String(y));
  var months = [];
  for(var m=1;m<=12;m++){ months.push(monthStats(state.days, y + '-' + pad2(m), Date.now())); }
  var labels = months.map(function(_, i){ return (i+1) + '월'; });
  var totSales = 0, totMin = 0, totDays = 0;
  months.forEach(function(x){ totSales += x.sales; totMin += x.workMinutes; totDays += x.workDays; });
  var totalHours = months.map(function(x){ return round1(x.workMinutes/60); });
  var avgHours = months.map(function(x){ return round1(x.avgMinutes/60); });
  var hourly = months.map(function(x){ return Math.round(x.hourly); });
  var hasAny = months.some(function(x){ return x.sales>0 || x.workMinutes>0; });

  var salesChart = groupedBarChart(labels, [
    {name:'영업금액', color:'#34D399', values: months.map(function(x){ return x.sales; }), fmt: fmtWon},
    {name:'카드수입', color:'#60A5FA', values: months.map(function(x){ return x.card; }), fmt: fmtWon},
    {name:'현금수입', color:'#64748B', values: months.map(function(x){ return x.cash; }), fmt: fmtWon}
  ], {unit:'won', height:300, title:y + '년 월별 수입'});

  var timeChart = comboTimeChart(labels, totalHours, avgHours, hourly, {height:300, title:y + '년 월별 운행시간'});

  var chartCards = hasAny
    ? ('<section class="card">'
      +   '<div class="card-h"><div class="card-t">월별 수입</div><div class="card-sub">단위 만원</div></div>'
      +   '<div class="chart-scroll">' + salesChart + '</div>'
      +   '<div class="chart-legend"><span><i style="background:#34D399"></i>영업금액</span><span><i style="background:#60A5FA"></i>카드수입</span><span><i style="background:#64748B"></i>현금수입</span></div>'
      + '</section>'
      + '<section class="card">'
      +   '<div class="card-h"><div class="card-t">월별 운행시간 · 시간당 매출</div><div class="card-sub">막대 h · 꺾은선</div></div>'
      +   '<div class="chart-scroll">' + timeChart + '</div>'
      +   '<div class="chart-legend"><span><i style="background:#34D399"></i>총 운행시간(h)</span><span><i style="background:#F5B342"></i>일평균 운행시간(h)</span><span><i style="background:#60A5FA"></i>시간당 매출(오른쪽 축, 만원)</span></div>'
      + '</section>')
    : ('<section class="card"><div class="card-h"><div class="card-t">월별 추이</div></div>'
      + '<div class="small muted center" style="padding:20px 6px;line-height:1.8">' + y + '년 기록이 아직 없습니다.<br>입력 화면에서 기록하거나 설정에서 샘플 데이터를 넣어 보세요.</div></section>');

  var html = ''
  + '<div class="screen-title"><h2>통계</h2><div class="row" style="gap:6px">'
  +   '<button class="btn btn-sm" data-act="prevYear">◀</button>'
  +   '<select id="yearSel" style="width:auto;min-height:34px;padding:4px 8px;font-weight:800">' + years.map(function(v){ return '<option value="' + v + '"' + (Number(v)===y?' selected':'') + '>' + v + '년</option>'; }).join('') + '</select>'
  +   '<button class="btn btn-sm" data-act="nextYear">▶</button>'
  + '</div></div>'
  + '<section class="card tight">'
  +   '<div class="grid3">'
  +     '<div class="kpi"><div class="v money hi">' + fmtWon(totSales) + '</div><div class="l">연간 영업금액</div></div>'
  +     '<div class="kpi"><div class="v time">' + fmtDur(totMin) + '</div><div class="l">연간 운행시간</div></div>'
  +     '<div class="kpi"><div class="v">' + totDays + '일</div><div class="l">연간 근무일</div></div>'
  +   '</div>'
  + '</section>'
  + chartCards
  + '<section class="card">'
  +   '<div class="card-h"><div class="card-t">월별 상세</div></div>'
  +   '<div class="table-wrap"><table class="data"><thead><tr><th>월</th><th>영업금액</th><th>카드</th><th>현금</th><th>근무</th><th>총 운행</th><th>일평균</th><th>시간당</th></tr></thead><tbody>'
  +   months.map(function(x, i){
        return '<tr><td>' + (i+1) + '월</td><td class="red">' + (x.sales?fmtNum(x.sales):'-') + '</td><td class="blue">' + (x.card?fmtNum(x.card):'-') + '</td><td>' + (x.cash?fmtNum(x.cash):'-') + '</td><td>' + (x.workDays||'-') + '</td><td>' + (x.workMinutes?fmtDurShort(x.workMinutes):'-') + '</td><td>' + (x.workDays?fmtDurShort(x.avgMinutes):'-') + '</td><td>' + (x.hourly?fmtNum(x.hourly):'-') + '</td></tr>';
      }).join('')
  +   '</tbody><tfoot><tr><td>합계</td><td>' + fmtNum(totSales) + '</td><td></td><td></td><td>' + totDays + '</td><td>' + fmtDurShort(totMin) + '</td><td>' + (totDays?fmtDurShort(totMin/totDays):'-') + '</td><td>' + (totMin?fmtNum(totSales/(totMin/60)):'-') + '</td></tr></tfoot></table></div>'
  +   (hasAny ? '' : '<div class="small muted center" style="margin-top:8px">' + y + '년 기록이 아직 없습니다.</div>')
  + '</section>';
  return html;
};

function dataYears(){
  var set = {};
  Object.keys(state.days).forEach(function(k){ set[k.slice(0,4)] = 1; });
  set[String(new Date().getFullYear())] = 1;
  set[String(ui.year)] = 1;
  return Object.keys(set).sort().reverse();
}

function storageSizeMb(){
  try{
    var s = localStorage.getItem(STORE_KEY) || '';
    return s.length * 2 / 1024 / 1024;
  }catch(e){ return 0; }
}
function fmtShortTime(ts){
  var d = new Date(ts);
  return pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/* ---------- 시작 / 종료 ---------- */
function doStart(){
  if(state.session){ toast('이미 운행 중입니다.'); return; }
  var now = new Date();
  var key = dateKey(now);
  var d = touchDay(key);
  if(d.off) d.off = false;
  d.runs.push({s: dtInput(now), e: ''});
  state.session = {start: dtInput(now), dayKey: key};
  saveNow();
  startGeo();
  ui.screen = 'home';
  render();
  toast('운행 시작 · ' + hm(dtInput(now)));
}
function doStop(){
  if(!state.session){ toast('운행 중이 아닙니다.'); return; }
  var now = new Date();
  var startAt = parseDT(state.session.start);
  var elapsedMin = startAt ? minutesBetween(startAt, now) : 0;
  if(elapsedMin > 20*60){
    if(!confirm('START를 누른 지 ' + Math.round(elapsedMin/60) + '시간 지났습니다.\n지금 종료하면 이 운행은 최대 24시간으로 계산됩니다.\n\n지금 종료할까요? (취소하면 입력 화면에서 시각을 직접 고칠 수 있습니다)')){
      ui.date = state.session.dayKey || dateKey(now);
      ui.screen = 'input';
      render();
      return;
    }
  }
  var key = state.session.dayKey || dateKey(now);
  var d = touchDay(key);
  var run = null;
  for(var i=d.runs.length-1;i>=0;i--){ if(d.runs[i].s && !d.runs[i].e){ run = d.runs[i]; break; } }
  if(!run){ d.runs.push({s: state.session.start, e: ''}); run = d.runs[d.runs.length-1]; }
  var rs = parseDT(run.s);
  var endDate = new Date(now.getTime());
  if(!rs || endDate.getTime() - rs.getTime() < 60000){
    endDate = new Date((rs ? rs.getTime() : now.getTime()) + 60000);
  }
  run.e = dtInput(endDate);
  d.u = Date.now();
  state.session = null;
  stopGeo();
  saveNow();
  render();
  toast('운행 종료 · ' + fmtDur(dayWorkMinutes(d, Date.now())));
}

/* ---------- GPS ---------- */
function startGeo(){
  if(!('geolocation' in navigator)){ gpsState.status = 'unsupported'; return; }
  if(gpsState.watch !== null) return;
  gpsState.status = 'wait';
  try{
    gpsState.watch = navigator.geolocation.watchPosition(onGeo, onGeoErr, {enableHighAccuracy:true, maximumAge:15000, timeout:30000});
  }catch(e){ gpsState.status = 'error'; }
}
function stopGeo(){
  if(gpsState.watch !== null && navigator.geolocation){
    try{ navigator.geolocation.clearWatch(gpsState.watch); }catch(e){}
  }
  gpsState.watch = null;
}
function onGeo(pos){
  gpsState.status = 'on';
  gpsState.lastAt = Date.now();
  if(!state.session) return;
  var key = state.session.dayKey || todayKey();
  var d = state.days[key];
  if(!d) return;
  if(!d.gps) d.gps = {points: []};
  var pts = d.gps.points;
  var p = {lat: +Number(pos.coords.latitude).toFixed(6), lng: +Number(pos.coords.longitude).toFixed(6), t: Date.now(), acc: Math.round(pos.coords.accuracy || 0)};
  var prev = pts.length ? pts[pts.length-1] : null;
  if(shouldRecordPoint(prev, p)){
    pts.push(p);
    if(pts.length > 3000) pts.splice(0, pts.length - 3000);
    d.u = Date.now();
    saveSoon();
    if(ui.screen === 'input' && ui.date === key) refreshCourse();
    if(ui.screen === 'home') refreshHomeCourse();
  }
  updateGpsLine();
}
function onGeoErr(err){
  gpsState.status = (err && err.code === 1) ? 'denied' : 'error';
  updateGpsLine();
}
function updateGpsLine(){
  var el = document.getElementById('gpsLine');
  if(!el) return;
  var txt;
  if(!('geolocation' in navigator)) txt = '이 브라우저는 위치 기능을 지원하지 않습니다 (운행 기록은 정상 저장)';
  else if(gpsState.status === 'denied') txt = '위치 권한이 꺼져 있어 코스가 기록되지 않습니다 (운행 기록은 정상 저장)';
  else if(gpsState.status === 'error') txt = '위치를 받지 못했습니다 · 실내에서는 정확도가 떨어질 수 있어요';
  else if(state.session){
    var pts = (state.days[state.session.dayKey || todayKey()] || {}).gps;
    var n = pts && pts.points ? pts.points.length : 0;
    txt = gpsState.status === 'on' ? ('GPS ' + n + '지점 기록 중') : 'GPS 위치 확인 중…';
  } else {
    var td = state.days[todayKey()];
    var n2 = td && td.gps && td.gps.points ? td.gps.points.length : 0;
    txt = n2 ? ('오늘 GPS ' + n2 + '지점 · 설정에서 지도를 켜면 코스가 보입니다') : 'START를 누르면 위치 기록이 시작됩니다';
  }
  el.textContent = txt;
}
function refreshCourse(){
  var pts = coursePoints();
  setText('courseCount', 'GPS ' + pts.length + '지점');
  setText('courseSpan', courseSpanText(pts));
  var link = document.getElementById('courseLink');
  if(link) link.setAttribute('href', buildMapsDirUrl(pts) || '#');
  updateMap('inputMap', pts);
}
function refreshHomeCourse(){
  var td = state.days[todayKey()];
  updateMap('homeMap', (td && td.gps && td.gps.points) || []);
}

var gmPromise = null, gmFailed = false;
window.gm_authFailure = function(){
  gmFailed = true;
  gmPromise = null;
  var msgs = document.querySelectorAll('.map-msg');
  for(var i=0;i<msgs.length;i++){
    msgs[i].style.display = '';
    msgs[i].classList.add('err');
    msgs[i].innerHTML = '지도를 표시하지 못했습니다.<br>API 키의 사용 제한·결제 설정을 확인해 주세요.<br>아래 버튼으로 구글 지도에서 코스를 열 수 있습니다.';
  }
};
function loadGmaps(key){
  if(window.google && window.google.maps && window.google.maps.Map) return Promise.resolve();
  if(gmFailed) return Promise.reject(new Error('auth'));
  if(gmPromise) return gmPromise;
  gmPromise = new Promise(function(resolve, reject){
    var cb = '__gmaps' + Math.floor(Math.random()*1e9);
    window[cb] = function(){ try{ delete window[cb]; }catch(e){} resolve(); };
    var s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&language=ko&region=KR&callback=' + cb;
    s.async = true; s.defer = true;
    s.onerror = function(){ gmPromise = null; reject(new Error('network')); };
    document.head.appendChild(s);
    setTimeout(function(){
      if(!(window.google && window.google.maps && window.google.maps.Map)){ gmPromise = null; reject(new Error('timeout')); }
    }, 12000);
  });

function drawRoute(id, pts){

    var map = new google.maps.Map(box, {
      center: path[0], zoom: 14, mapTypeControl: false, streetViewControl: false,
      fullscreenControl: false, clickableIcons: false, gestureHandling: 'cooperative'
    });

      try{ markers.push(new google.maps.Marker({map: map, position: path[path.length-1], title: '도착', label: '도'})); }catch(e){}
      var b = new google.maps.LatLngBounds();
      path.forEach(function(p){ b.extend(p); });
      map.fitBounds(b, {top: 28, right: 28, bottom: 28, left: 28});

function resizeImage(file, maxSide, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('image')); };
      img.onload = function(){
        try{
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', quality));
        }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

var GIS_SRC = 'https://accounts.google.com/gsi/client';
var DRIVE_SCOPE = 'openid email https://www.googleapis.com/auth/drive.appdata';
var SYNC_FILE = 'tapp_personal_taxi_sync.json';

function errText(err){
  var m = String(err && err.message ? err.message : err);
  if(m === 'no_client') return 'OAuth 클라이언트 ID를 먼저 입력해 주세요';
  if(m === 'gis' || m === 'gis_load' || m === 'gis_timeout') return '구글 로그인 스크립트를 불러오지 못했습니다 (네트워크 확인)';
  if(m === 'popup_closed' || m === 'access_denied' || m === 'user_cancel') return '로그인 창을 닫았습니다';
  if(m === 'interaction_required' || m === 'login_required') return '다시 로그인해 주세요';
  if(m === 'auth') return '구글 인증에 실패했습니다';
  if(/^HTTP 401/.test(m)) return '로그인이 만료되었습니다. 다시 로그인해 주세요';
  if(/^HTTP 403/.test(m)) return '드라이브 접근이 거부되었습니다 (' + (m.slice(9, 100) || 'Drive API/권한 확인') + ')';
  if(/^HTTP 404/.test(m)) return '동기화 파일을 찾지 못했습니다';
  if(/^HTTP /.test(m)) return '구글 서버 오류 (' + m.slice(0, 60) + ')';
  if(/Failed to fetch|NetworkError|network/i.test(m)) return '네트워크에 연결하지 못했습니다';

function loadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(gisPromise) return gisPromise;
  gisPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = GIS_SRC; s.async = true; s.defer = true;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ gisPromise = null; reject(new Error('gis_load')); };

function requestToken(interactive){
  return new Promise(function(resolve, reject){
    var cid = (state.settings.oauthClientId || '').trim();
    if(!cid) return reject(new Error('no_client'));
    if(!window.google || !google.accounts || !google.accounts.oauth2) return reject(new Error('gis'));
    try{
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: DRIVE_SCOPE,
        callback: function(resp){
          if(!resp || resp.error){ reject(new Error(resp && resp.error ? resp.error : 'auth')); return; }
          accessToken = resp.access_token;
          tokenExp = Date.now() + (Number(resp.expires_in) || 3600)*1000 - 60000;
          resolve(resp);
        }
      });
      tokenClient.requestAccessToken(interactive ? {prompt:'select_account'} : {});
    }catch(e){ reject(e); }
  });
}
async function ensureToken(interactive){
  if(accessToken && Date.now() < tokenExp) return accessToken;
  await loadGis();

}
async function authFetch(url, opts){
  var tok = await ensureToken(false);
  var o = opts || {};
  o.headers = Object.assign({}, o.headers || {}, {Authorization: 'Bearer ' + tok});
  var res = await fetch(url, o);
  if(res.status === 401){
    accessToken = null;
    tok = await ensureToken(false);
    o.headers.Authorization = 'Bearer ' + tok;
    res = await fetch(url, o);
  }
  if(!res.ok){
    var txt = '';
    try{ txt = await res.text(); }catch(e){}
    throw new Error('HTTP ' + res.status + ' ' + txt.slice(0, 160));
  }
  return res;
}
async function findSyncFile(){

    + '\r\n--' + boundary + '--';

function scheduleAutoSync(delay){
